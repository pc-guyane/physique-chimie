          else s += `<line x1="22" x2="98" y1="${yt.toFixed(1)}" y2="${yt.toFixed(1)}" class="c-jauge vif"/><text x="100" y="${(yt + 4).toFixed(1)}" class="c-grad-t">trait</text>`;
        }
        const yl = y(niveau), coul = cfg.coul || COUL.eau, lw = cfg.etroit ? 18 : 40, lx = 60 - lw / 2;
        const liq = `<rect x="${lx}" y="${Math.max(0, yl).toFixed(1)}" width="${lw}" height="${Math.max(0, H - yl).toFixed(1)}" fill="${coul}" opacity=".9"/>`;
        const men = yl > -10 && yl < H + 10 ? `<path d="M${lx} ${(yl - 4).toFixed(1)}q${lw / 2} ${(lw / 3.5).toFixed(1)} ${lw} 0" class="c-menisque"/>` : "";
        return `<svg class="c-loupe" viewBox="0 0 130 ${H}" role="img" aria-label="Loupe"><rect x="${lx}" y="0" width="${lw}" height="${H}" class="c-verre"/>${liq}${men}${s}</svg>`;
      }
      const loupeBurette = () => loupe(S.bur.r, Math.max(-0.4, Math.min(24.6, S.bur.r)), { coul: COUL.soude });
      const loupeFiole = (F) => loupe(F.V, Math.min(F.Vf, F.V + 0.9), { trait: F.Vf, k: F.Vf >= 500 ? 60 : 110 });
      const loupePipette = (p) => { const v = p.niv * p.vol; return loupe(v, Math.max(v - 0.2, p.vol - 0.3), { trait: p.vol, k: 160, etroit: true, coul: COUL[S.ajust.contenu] }); };
      const fioleEnCours = () => S.ordre.map(O).find((o) => o.type === "fiole" && o.mode);
      function panneau() {
        let h = "";
        const F = fioleEnCours();
        if (S.ajust) {
          const p = O(S.ajust.pip);
          h += `<div class="c-pan c-pan-vif"><div class="c-pan-l" data-l="pip">${loupePipette(p)}</div>
            <div class="c-pan-r"><strong>Ajuster au trait de jauge de la pipette</strong><span class="small muted">Le liquide est monté au-dessus du trait. Avec la molette du pipeteur, fais-le redescendre goutte à goutte : le bas du ménisque doit être exactement sur le trait.</span>
            <div class="c-btns"><button class="btn btn-ghost btn-sm" data-pg>1 goutte</button><button class="btn-link" data-pr>Réaspirer</button></div>
            <button class="btn btn-primary btn-sm" data-pt>Le ménisque est sur le trait</button></div></div>`;
        } else if (F) {
          h += `<div class="c-pan c-pan-vif"><div class="c-pan-l" data-l="fio">${loupeFiole(F)}</div>
            <div class="c-pan-r"><strong>Compléter la fiole au trait de jauge</strong><span class="small muted">Le bas du ménisque doit être sur le trait. Termine goutte à goutte.</span>
            <div class="c-btns"><button class="btn btn-ghost btn-sm" data-jet>Petit jet (${F.Vf >= 500 ? "1 mL" : "0,5 mL"})</button><button class="btn btn-ghost btn-sm" data-goutte>1 goutte</button></div>
            <button class="btn btn-primary btn-sm" data-trait>Le ménisque est sur le trait</button></div></div>`;
        }
        if (S.bur) {
          const b = S.bur, sb = sousBurette();
          h += `<div class="c-pan"><div class="c-pan-l" data-l="bur">${b.rempli ? loupeBurette() : `<p class="small muted">La burette est vide.</p>`}</div>
            <div class="c-pan-r"><strong>Robinet de la burette</strong><span class="small muted">${!b.sur ? "La burette n'est pas encore fixée sur la potence." : sb ? `Elle verse dans ${esc(nomObjet(sb))}.` : "Aucun bécher sous la burette !"}</span>
            <div class="c-btns">${[[0.05, "1 goutte"], [0.2, "0,2 mL"], [0.5, "0,5 mL"], [1, "1 mL"], [2, "2 mL"]].map(([v, l]) => `<button class="btn btn-ghost btn-sm" data-v="${v}" ${b.rempli ? "" : "disabled"}>${l}</button>`).join("")}</div>
            <div class="c-btns"><button class="btn btn-primary btn-sm" data-zero ${b.rempli && !b.pret ? "" : "disabled"}>Le zéro est fait</button><button class="btn-link" data-vider ${b.rempli ? "" : "disabled"}>Vider la burette</button></div></div></div>`;
        }
        zPan.innerHTML = h;
        const on = (sel, f) => { const x = zPan.querySelector(sel); if (x) x.onclick = () => { if (occupe()) return; f(); }; };
        zPan.querySelectorAll("[data-v]").forEach((x) => x.onclick = () => { if (!occupe()) verser(+x.dataset.v); });
        on("[data-zero]", zero); on("[data-vider]", vider);
        on("[data-jet]", () => remplirFiole(F, F.Vf >= 500 ? 1 : 0.5)); on("[data-goutte]", () => remplirFiole(F, 0.05)); on("[data-trait]", () => verifierTrait(F));
        on("[data-pg]", goutteAjust); on("[data-pr]", reaspirer); on("[data-pt]", validerAjust);
      }
      function majLoupe() {
        const lp = zPan.querySelector('[data-l="pip"]'), lf = zPan.querySelector('[data-l="fio"]'), lb = zPan.querySelector('[data-l="bur"]'), F = fioleEnCours();
        if (lp && S.ajust) lp.innerHTML = loupePipette(O(S.ajust.pip));
        if (lf && F) lf.innerHTML = loupeFiole(F);
        if (lb && S.bur && S.bur.rempli) lb.innerHTML = loupeBurette();
      }
      function choix(question, options) {
        zChoix.innerHTML = `<div class="c-choix-in"><strong>${esc(question)}</strong>${options.map((o, i) => `<button class="btn btn-ghost btn-sm" data-c="${i}">${esc(o[0])}</button>`).join("")}<button class="btn-link" data-c="-1">Annuler</button></div>`;
        zChoix.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { const i = +b.dataset.c; zChoix.innerHTML = ""; if (i >= 0) options[i][1](); });
      }

      // ----- La burette -----
      function verser(v) {
        const b = S.bur, cible = sousBurette();
        if (!b.rempli) return;
        if (!cible) { message("Il n'y a aucun bécher sous la burette : la soude coulerait sur la paillasse ! Place d'abord un bécher dessous.", "err"); return; }
        if (cible.role === "titrage" && !cible.echant) { message("Le bécher de titrage ne contient pas encore la prise d'essai : prélève-la d'abord avec la pipette jaugée.", "err"); return; }
        if (cible.role === "titrage" && !b.pret) { message("Prépare d'abord la burette : rinçage à la soude, remplissage, bulle chassée et zéro fait. Pour l'instant, verse dans le bécher poubelle.", "err"); return; }
        if (b.r + v > 25.001) { message("La burette n'a que 25 mL de graduations : n'ouvre pas le robinet au-delà de 25 mL.", "err"); return; }
        let delivre = v, bulleChassee = false;
        if (b.bulle && v >= 0.5) { b.bulle = false; bulleChassee = true; delivre = Math.max(0, v - 0.3); }
        const r0 = b.r, d = v >= 0.5 ? 0.3 + 0.2 * v : 0.25 + v * 2, t = pointe(), nG = Math.round(v / 0.05);
        let fait = 0, g = 0;
        anime(d, (p) => {
          b.r = r0 + v * p;
          const dv = delivre * p - fait; fait = delivre * p; cible.V += dv;
          if (cible.role === "titrage") cible.libre += b.c * dv;
          if (v >= 0.5) jet(t.x, t.y, t.x, surface(cible), COUL.soude, 2.2);
          else while (g < Math.min(nG, Math.ceil(p * nG))) { goutte(t.x, t.y + 2, surface(cible), COUL.soude); g++; }
          majLoupe();
        }, () => {
          b.r = Math.round((r0 + v) * 100) / 100;
          if (bulleChassee && cible.role === "poubelle") message("La bulle d'air est chassée : le bas de la burette est maintenant plein de soude.", "ok");
          if (cible.role === "titrage") {
            if (S.eauAvant == null) { S.eauAvant = cible.eauAj; ctx.evt("premiereGoutte", { eau: cible.eauAj }); }
            S.attente = { V: b.r, depuis: S.t, nonAgite: false };
            if (!sondeDans(cible)) message(`Place ${kind === "cond" ? "la cellule" : "la sonde"} dans le bécher pour suivre la mesure : ce volume n'est pas mesuré.`, "err");
          }
          if (b.r >= 24.999) message("La burette est presque vide.", "info");
          majLoupe();
        });
      }
      function zero() {
        const b = S.bur;
        if (b.malRincee) { message("Ta burette n'avait pas été rincée avec la soude : il restait de l'eau dedans, la soude est un peu diluée et Vₑ serait faux. Vide la burette, rince-la avec un peu de soude, puis remplis-la.", "err"); return; }
        if (b.bulle) { message("Il reste une bulle d'air sous le robinet. Chasse-la en ouvrant le robinet en grand (0,5 mL ou plus) au-dessus du bécher poubelle, puis refais le zéro.", "err"); return; }
        if (b.r < -0.025) { message("Le bas du ménisque est encore au-dessus de la graduation 0 : laisse couler quelques gouttes dans le bécher poubelle.", "err"); return; }
        if (b.r > 0.025) { message("Tu as dépassé le zéro. Remplis à nouveau la burette avec la soude, puis recommence l'ajustement goutte à goutte.", "err"); return; }
        b.r = 0; b.pret = true; message("Burette prête : le bas du ménisque est sur le zéro et il n'y a plus de bulle.", "ok");
        ctx.evt("burettePrete"); dessinerTout(); panneau();
      }
      function vider() {
        const b = S.bur, cible = sousBurette();
        if (cible && cible.role === "titrage" && b.pret) { message("Attention : tu allais vider la burette dans le bécher de titrage ! Mets d'abord le bécher poubelle sous la burette.", "err"); return; }
        if (!cible) { message("Place d'abord le bécher poubelle sous la burette.", "err"); return; }
        const t = pointe(), r0 = b.r;
        anime(0.9, (p) => { b.r = r0 + (25.8 - r0) * p; jet(t.x, t.y, t.x, surface(cible), COUL.soude, 2.6); majLoupe(); }, () => {
          cible.V += Math.max(0, 25 - r0); b.rempli = false; b.r = 0; b.pret = false; b.bulle = false; b.malRincee = false;
          message("La burette est vide.", "info"); panneau();
        });
      }
      function flaconSurBurette(f, apres) { const b = S.bur; suite([vers(f, b.x - 30, b.y - 62, 0.4), tourner(f, 55, 0.25)], apres); }
      function rendreFlacon(f, fin) { suite([tourner(f, 0, 0.2), retour(f, 0.35)], fin); }
      function rincerBurette(f) {
        const b = S.bur, sb = sousBurette();
        if (!sb) { message("Place d'abord le bécher poubelle sous la burette : la soude de rinçage va couler dedans.", "err"); return; }
        if (sb.role === "titrage") { message("On rince au-dessus du bécher poubelle, jamais au-dessus du bécher de titrage.", "err"); return; }
        const t = pointe();
        flaconSurBurette(f, () => suite([
          [0.6, () => jet(b.x + 10, b.y - 44, b.x + 12, b.y + 4, COUL.soude, 2.4, 6)],
          [0.8, () => { jet(t.x, t.y, t.x, surface(sb), COUL.soude, 2.2); sb.V += 0.06; }]
        ], () => { b.rinceSoude = true; message("Burette rincée avec un peu de soude : les dernières gouttes d'eau sont parties dans le bécher poubelle.", "ok"); rendreFlacon(f, () => { dessinerTout(); panneau(); }); }));
      }
      function remplirBurette(f) {
        const b = S.bur, sb = sousBurette();
        if (sb && sb.role === "titrage") { message("On remplit la burette avec le bécher poubelle dessous, jamais au-dessus du bécher de titrage.", "err"); return; }
        if (!sb) { message("Place d'abord le bécher poubelle sous la burette : on remplit robinet fermé, mais un bécher doit être dessous pour la suite.", "err"); return; }
        const r0 = -Math.round((0.6 + Math.random() * 0.8) * 100) / 100;
        b.malRincee = !b.rinceSoude;
        flaconSurBurette(f, () => {
          b.rempli = true; b.r = 25.8; b.c = b.malRincee ? D.c2 * 0.97 : D.c2; b.bulle = true; b.pret = false; panneau();
          anime(1.2, (p) => { b.r = 25.8 + (r0 - 25.8) * p; jet(b.x + 10, b.y - 44, b.x + 12, b.y + 4, COUL.soude, 2.6, 6); majLoupe(); }, () => {
            b.r = r0;
            message(b.malRincee ? "Burette remplie… mais elle n'avait pas été rincée avec la soude." : "Burette remplie au-dessus du zéro. Une bulle d'air est restée sous le robinet.", b.malRincee ? "err" : "info");
            rendreFlacon(f, () => { dessinerTout(); panneau(); });
          });
        });
      }

      // ----- La pipette : aspirer, ajuster au trait, verser -----
      function aspirer(p, src) {
        const cx = src.x + src.w / 2 - 9, ty = src.type === "fiole" ? src.y + src.h * 0.62 - p.h : src.y + src.h - 10 - p.h;
        S.ajust = { pip: p.id, src: src.id, contenu: src.contenu };
        const vMax = (p.vol + 0.2 + Math.random() * 0.3) / p.vol;
        suite([vers(p, cx, ty, 0.45), [1.0, (q) => { p.niv = vMax * q; }]], () => {
          src.V = Math.max(0, src.V - p.vol);
          message("Le liquide est monté au-dessus du trait de jauge. Ajuste maintenant au trait, goutte à goutte (loupe sous la paillasse).", "info");
          panneau(); dessinerTout();
        });
        panneau();
      }
      function goutteAjust() {
        const p = O(S.ajust.pip), src = O(S.ajust.src);
        p.niv = Math.max(0, p.niv - 0.05 / p.vol);
        goutte(p.x + p.ax + 9, p.y + p.ay + p.h, src.type === "fiole" ? src.y + src.h * 0.8 : surface(src), COUL[S.ajust.contenu]);
        dessinerTout(); majLoupe();
      }
      function reaspirer() {
        const p = O(S.ajust.pip), v = (p.vol + 0.15 + Math.random() * 0.25) / p.vol, n0 = p.niv;
        anime(0.6, (q) => { p.niv = n0 + (v - n0) * q; majLoupe(); }, () => message("Tu as réaspiré un peu de liquide : recommence l'ajustement au trait.", "info"));
      }
      function validerAjust() {
        const p = O(S.ajust.pip), vol = p.niv * p.vol;
        if (vol > p.vol + 0.025) { message("Pas encore : le bas du ménisque est au-dessus du trait. Fais descendre encore quelques gouttes.", "err"); return; }
        if (vol < p.vol - 0.025) { message("Le ménisque est descendu sous le trait : la pipette ne contient plus le bon volume. Réaspire, puis recommence l'ajustement.", "err"); return; }
        p.niv = 1; p.contenu = S.ajust.contenu; p.pret = true; S.ajust = null;
        message(`Pipette ajustée au trait : elle contient exactement ${fx(p.vol, 1)} mL. Touche maintenant le récipient où la verser.`, "ok");
        ctx.evt("ajuste", { vol: p.vol });
        suite([retour(p, 0.35)], () => { dessinerTout(); majMain(); });
        panneau();
      }
      function viderPipette(p, cible, fin) {
        const cx = cible.x + cible.w / 2 - 9, ty = cible.type === "fiole" ? cible.y + 4 - p.h * 0.5 : cible.y + 16 - p.h;
        const vol = p.vol; let fait = 0;
        suite([vers(p, cx, ty, 0.45), [1.1, (q) => { p.niv = 1 - q; const dv = vol * q - fait; fait = vol * q; cible.V += dv; }], pause(0.25), retour(p, 0.35)], () => {
          p.niv = 0; const c = p.contenu; p.contenu = null; p.pret = false; S.main = null; fin(c); dessinerTout(); majMain(); panneau();
        });
      }

      // ----- La fiole jaugée -----
      function remplirFiole(F, v) {
        if (!F || !F.mode) return;
        F.V = Math.round((F.V + v) * 100) / 100;
        if (F.V > F.Vf + 0.6) { F.rate = true; F.mode = false; message("Le ménisque a nettement dépassé le trait de jauge : la solution est trop diluée. Il faut recommencer la dilution.", "err"); panneau(); dessinerTout(); return; }
        const k = F.Vf >= 500 ? 1 : 0.66; goutte(F.x + 45 * k + 4, F.y - 6, F.y + 40 * k, COUL.eau);
        dessinerTout(); majLoupe();
      }
      function verifierTrait(F) {
        if (F.V < F.Vf - 0.03) { message("Pas encore : le bas du ménisque est sous le trait de jauge. Termine goutte à goutte.", "err"); return; }
        if (F.V > F.Vf + 0.03) { F.rate = true; F.mode = false; message("Le bas du ménisque est au-dessus du trait : il y a trop d'eau. Il faut recommencer la dilution (touche « Recommencer la manipulation »).", "err"); panneau(); return; }
        F.mode = false; F.ok = true; message("Fiole ajustée au trait de jauge. Bouche-la et retourne-la plusieurs fois pour homogénéiser : touche la fiole.", "ok");
        ctx.evt("trait"); panneau(); dessinerTout();
      }
      function homogeneiser(F) {
        F.homog = true;
        suite([vers(F, F.x, F.y - 16, 0.25), tourner(F, 170, 0.4), tourner(F, 0, 0.4), tourner(F, 170, 0.4), tourner(F, 0, 0.4), retour(F, 0.25)], () => {
          message("Fiole bouchée et retournée plusieurs fois : la solution est homogène. La dilution est terminée.", "ok"); ctx.evt("homog"); dessinerTout();
        });
      }

      // ----- La pissette : jets d'eau distillée -----
      function pissetteVers(p, tx, ty, d, pendant, fin) {
        const px = Math.max(4, tx - 44), py = Math.max(4, ty - 34);
        suite([vers(p, px, py, 0.35), tourner(p, 25, 0.15), [d, (q) => { jet(px + 32, py + 4, tx, ty, COUL.eau, 2, -10); if (pendant) pendant(q); }], tourner(p, 0, 0.15), retour(p, 0.35)], fin);
      }
      function rincerSonde(p) {
        const so = O("son"), pou = O("pou"), [x, y] = posSonde();
        pissetteVers(p, x + 2, y + 18, 1.0, () => { if (Math.random() < 0.3) goutte(x + 6, y + so.h, surface(pou), COUL.eau); }, () => {
          S.sonde.sale = null; pou.V += 4; message(`${kind === "cond" ? "Cellule rincée" : "Sonde rincée"} à l'eau distillée : l'eau de rinçage est tombée dans le bécher poubelle.`, "ok"); ctx.evt("rinceSonde"); dessinerTout();
        });
      }

      // ----- La sonde -----
      const sondeDans = (b) => S.sonde && S.sonde.lieu === b.id && b.V >= (kind === "cond" ? 40 : 30);
      function placerSonde(b) {
        const s = S.sonde, nom = kind === "cond" ? "la cellule" : "la sonde", Nom = kind === "cond" ? "La cellule" : "La sonde";
        if (b.role === "poubelle") { s.lieu = null; s.dessus = true; S.main = null; message(`${Nom} est au-dessus du bécher poubelle : rince-la avec la pissette (prends la pissette, puis touche ${nom}).`, "info"); return; }
        if (b.role === "prelev") { message(`On ne plonge pas ${nom} dans le bécher de prélèvement.`, "err"); return; }
        if (s.sale && s.sale !== b.id) { message(`Rince d'abord ${nom} à l'eau distillée, au-dessus du bécher poubelle : sinon tu pollues ${b.role === "tampon" ? "le tampon" : "la solution"}.`, "err"); return; }
        s.lieu = b.id; s.dessus = false; S.main = null;
        if (b.role === "titrage" && b.V < (kind === "cond" ? 40 : 30)) message(`${Nom} n'est pas assez immergée : ajoute de l'eau distillée dans le bécher.`, "err");
        else message(`${Nom} est dans ${nomObjet(b)}.`, "info");
        ctx.evt("sonde", { lieu: b.id }); verifierMontage();
      }
      function prendreSonde() { const s = S.sonde; if (s.lieu) { s.sale = s.lieu; s.lieu = null; } s.dessus = false; }

      // ----- Toucher un objet -----
      function toucher(id, act) {
        if (occupe()) return;
        zChoix.innerHTML = "";
        if (S.ajust) { message("Termine d'abord l'ajustement de la pipette au trait (sous la paillasse).", "err"); return; }
        const o = O(id), m = S.main && O(S.main);
        if (act === "etal") return etalonner();
        if (!m) return toucherVide(o);
        if (S.main === id) { S.main = null; dessinerTout(); majMain(); return; }
        utiliser(m, o); dessinerTout(); majMain(); panneau();
      }
      const PRENABLES = ["flacon", "pissette", "pipette", "pipeteur", "barreau", "sonde", "eprouvette"];
      function toucherVide(o) {
        if (PRENABLES.includes(o.type)) { if (o.type === "sonde") prendreSonde(); S.main = o.id; message(""); }
        else if (o.type === "agitateur") {
          o.on = !o.on; const b = O("bt"), ok = b && surAgitateur(b) && b.barreau && b.V > 0;
          message(o.on ? (ok ? "Agitation en marche." : "L'agitateur tourne, mais aucun bécher avec un barreau aimanté n'est posé dessus : rien n'est agité.") : "Agitation arrêtée.", o.on && !ok ? "err" : "info");
        } else if (o.type === "becher") message(o.role === "titrage" ? `Bécher de titrage : ${fx(o.V, 0)} mL environ.${M.montage && !o.sur ? " Glisse-le sur l'agitateur, sous la burette." : ""}` : o.role === "poubelle" ? "Le bécher poubelle recueille les rinçages et les purges." : o.role === "prelev" ? "Bécher de prélèvement : on y verse un peu de solution, puis on pipette dedans." : "Bécher de " + NOMS[o.contenu] + ".", "info");
        else if (o.type === "fiole") {
          if (o.ok && !o.homog) return homogeneiser(o);
          message(o.homog && o.contenu ? `La fiole contient ${NOMS[o.contenu]} : tu peux y pipeter directement.` : `Fiole jaugée de ${fx(o.Vf, 1)} mL.`, "info");

      for (let i = 0; ymin + i * pasY / 2 <= ymax + 1e-9; i++) { const v = ymin + i * pasY / 2, maj = i % 2 === 0; s += `<line x1="${g.x0}" x2="${g.x1}" y1="${g.Y(v).toFixed(1)}" y2="${g.Y(v).toFixed(1)}" class="${maj ? "c-q1" : "c-q2"}"/>${maj ? `<text x="${g.x0 - 5}" y="${(g.Y(v) + 4).toFixed(1)}" text-anchor="end">${fx(v, decY || 0)}</text>` : ""}`; }
      s += `<line x1="${g.x0}" y1="${g.y0}" x2="${g.x1}" y2="${g.y0}" stroke="var(--muted)"/><line x1="${g.x0}" y1="${g.y0}" x2="${g.x0}" y2="${g.y1}" stroke="var(--muted)"/>
        <text x="${g.x1}" y="${H - 2}" text-anchor="end">${esc(labX)}</text><text x="4" y="9">${esc(labY)}</text>`;
      g.fond = s; return g;
    }
    const echelle = (kind, pts, Ve) => {
      const xmax = Math.max(Ve + 6, ...pts.map((p) => p[0]), 10), xm = Math.ceil(xmax / 2) * 2;
      if (kind === "ph") return { xmax: xm, ymin: 0, ymax: 14, pasY: 2, labY: "pH", dec: 0 };
      const ym = Math.max(...pts.map((p) => p[1]), 0.5); return { xmax: xm, ymin: 0, ymax: Math.ceil(ym * 2) / 2 + 0.5, pasY: 0.5, labY: "σ (mS/cm)", dec: 1 };
    };
    function graphePoints(kind, pts, Ve, extra) {
      const E = echelle(kind, pts, Ve), g = repere(340, 240, E.xmax, E.ymin, E.ymax, "V versé (mL)", E.labY, 2, E.pasY, E.dec);
      const s = pts.map((p, i) => `<circle cx="${g.X(p[0]).toFixed(1)}" cy="${g.Y(p[1]).toFixed(1)}" r="3.2" class="c-pt" data-i="${i}"/>`).join("");
      return { g, svg: `<svg class="chart c-chart" viewBox="0 0 340 240" role="img" aria-label="Courbe de titrage">${g.fond}${extra ? extra(g) : ""}${s}</svg>` };
    }
    // Pointeur de lecture graphique : réticule, coordonnées lues, réglage fin avec les flèches
    function pointeur(zone, cfg) {
      // cfg : { rendu(cross) → {svg, g}, nomY, uniteY, decY, pasY, V0, libre (lecture n'importe où) ou f (le pointeur suit la courbe), change }
      const P = { V: cfg.V0 != null ? cfg.V0 : 2, y: 0 };
      if (!cfg.libre && cfg.f) P.y = cfg.f(P.V);
      else if (cfg.y0 != null) P.y = cfg.y0;
      let g = null;
      function dessiner() {
        const r = cfg.rendu((gg) => {
          const x = gg.X(P.V), y = gg.Y(P.y);
          return `<g class="c-reticule" pointer-events="none"><line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${gg.y1}" y2="${gg.y0}"/><line x1="${gg.x0}" x2="${gg.x1}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/></g>`;
        });
        g = r.g;
        zone.querySelector(".c-g").innerHTML = r.svg;
        zone.querySelector(".c-lect").innerHTML = `Pointeur : <b>V = ${fx(P.V, 2)} mL</b> ; <b>${esc(cfg.nomY)} = ${fx(P.y, cfg.decY)}${cfg.uniteY ? " " + esc(cfg.uniteY) : ""}</b>`;
        const s = zone.querySelector(".c-g svg");
        s.style.touchAction = "none";
        const bouger = (e) => {
          const p = s.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(s.getScreenCTM().inverse());
          P.V = Math.max(0, Math.min(g.xmax, Math.round(g.Vx(q.x) * 20) / 20));
          P.y = cfg.libre ? Math.max(g.ymin, Math.min(g.ymax, Math.round(g.Vy(q.y) / cfg.pasY) * cfg.pasY)) : cfg.f(P.V);
          dessiner(); if (cfg.change) cfg.change(P);
        };
        if (!cfg.sansGeste) {
          s.onpointerdown = (e) => { e.preventDefault(); try { s.setPointerCapture(e.pointerId); } catch (er) { /* rien */ } bouger(e); s.onpointermove = bouger; };
          s.onpointerup = () => { s.onpointermove = null; };
        }
        if (cfg.apres) cfg.apres(s, g);
      }
      zone.innerHTML = `<div class="c-g"></div><div class="c-lecture"><span class="c-lect"></span>
        <span class="c-regl"><button class="btn btn-ghost btn-xs" data-d="-1" aria-label="Pointeur vers la gauche">◀</button><button class="btn btn-ghost btn-xs" data-d="1" aria-label="Pointeur vers la droite">▶</button>${cfg.libre ? `<button class="btn btn-ghost btn-xs" data-h="1" aria-label="Pointeur vers le haut">▲</button><button class="btn btn-ghost btn-xs" data-h="-1" aria-label="Pointeur vers le bas">▼</button>` : ""}</span></div>`;
      zone.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { P.V = Math.max(0, Math.round((P.V + 0.05 * +b.dataset.d) * 100) / 100); if (!cfg.libre) P.y = cfg.f(P.V); dessiner(); if (cfg.change) cfg.change(P); });
      zone.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => { P.y = Math.round((P.y + cfg.pasY * +b.dataset.h) * 1000) / 1000; dessiner(); if (cfg.change) cfg.change(P); });
      dessiner();
      return { P, dessiner };
    }
    function tableau(kind, pts) {
      return `<div class="table-wrap c-table"><table class="mes-table"><thead><tr><th>V (mL)</th><th>${kind === "cond" ? "σ (mS/cm)" : "pH"}</th></tr></thead><tbody>
        ${pts.map((p) => `<tr><td>${fx(p[0], 2)}</td><td>${kind === "cond" ? fx(p[1], 3) : fx(p[1], 2)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function tangentes(f, V1, Ve, Vmax) {
      const d = (v) => (f(v + 0.01) - f(v - 0.01)) / 0.02, s = d(V1);
      let a = Ve + 0.05, b = Vmax, V2 = Vmax;
      if (d(b) <= s) { for (let k = 0; k < 50; k++) { const m = (a + b) / 2; if (d(m) > s) a = m; else b = m; } V2 = (a + b) / 2; }
      const c1 = f(V1) - s * V1, c2 = f(V2) - s * V2, cm = (c1 + c2) / 2;
      let lo = V1, hi = V2; for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (f(m) < s * m + cm) lo = m; else hi = m; }
      const VE = (lo + hi) / 2;
      return { s, c1, c2, cm, V1, V2, VE, pHE: f(VE) };
    }
    const regression = (P) => { const n = P.length, mx = P.reduce((a, p) => a + p[0], 0) / n, my = P.reduce((a, p) => a + p[1], 0) / n; let sxy = 0, sxx = 0; P.forEach((p) => { sxy += (p[0] - mx) * (p[1] - my); sxx += (p[0] - mx) ** 2; }); const a = sxx ? sxy / sxx : 0; return { a, b: my - a * mx }; };

    // Calculs guidés : une étape après l'autre, chaque résultat est vérifié
    function calculsGuides(el, etapes, etat, onFini) {
      function rendu() {
        const n = etat.n || 0;
        el.innerHTML = etapes.map((e, i) => {
          if (i > n) return "";
          if (i < n) return `<div class="c-etape ok"><span class="c-num">✓</span><div><p class="small">${esc(e.consigne)}</p><p class="c-rep">${esc(e.corrige())}</p></div></div>`;
          return `<div class="c-etape cur"><span class="c-num">${i + 1}</span><div class="stack"><p>${esc(e.consigne)}</p>${e.formule ? `<p class="small muted">${esc(e.formule)}</p>` : ""}
            <div class="calc-in"><label class="small" for="cg-${i}">${esc(e.nom)} =</label><input type="text" id="cg-${i}" inputmode="decimal" autocomplete="off"><span class="u">${esc(e.unite)}</span></div>
            <button class="btn btn-primary btn-sm" data-v>Vérifier</button><div class="fbz"></div></div></div>`;
        }).join("") + (n >= etapes.length ? "" : `<p class="small muted">Étape ${n + 1} sur ${etapes.length}. Calcule à la calculatrice, avec les valeurs déjà trouvées.</p>`);
        const b = el.querySelector("[data-v]");
        if (b) b.onclick = () => {
          const e = etapes[n], v = lireNombre(el.querySelector("#cg-" + n).value), fb = el.querySelector(".fbz");
          if (isNaN(v)) { fb.innerHTML = `<p class="error">Écris un nombre (avec une virgule si besoin).</p>`; return; }
          const ref = e.val();
          if (Math.abs(v - ref) <= (e.tol || 0.03) * Math.abs(ref)) { etat.n = n + 1; sauver(); rendu(); if (etat.n >= etapes.length) onFini(); }
          else fb.innerHTML = `<div class="feedback ko"><strong>Pas encore</strong><span>${esc(e.aide(v, ref))}</span></div>`;
        };
      }
      rendu();
    }

    // ---------- 6. Les pages : choix du TP, puis le laboratoire ----------
    function vueLabos(niv, ch, labId) {
      const tp = ch.tp, cle = `${niv}-${ch.id}-tp`;
      const L = tp.labos;
      const cleL = (l) => cle + "-" + l.id;
      const ouvertL = (i) => modeProf() || L.slice(0, i).every((l) => fait(cleL(l)));
      const lab = L.find((l) => l.id === labId);
      if (lab && ouvertL(L.indexOf(lab))) return vueLabo(niv, ch, lab, cle, cleL);
      view.innerHTML = `<div class="head"><span class="kicker">TP</span><h2>${esc(tp.titre)}</h2><p class="muted">${esc(tp.intro)}</p></div>
        <div class="stack">${L.map((l, i) => {
          const ok = fait(cleL(l)), open = ouvertL(i);
          const inner = `<span class="ico">${SVG.titrages}</span><span class="txt"><span class="t">${esc(l.titre)}</span><span class="s">${esc(l.sousTitre)}</span><span class="s">${ok ? "Terminé" : open ? "À faire" : "Termine d'abord le TP " + i}</span></span><span class="go">${ok ? SVG.check : open ? "›" : SVG.lock}</span>`;
          return open ? `<a class="card" href="#c-${niv}-${ch.id}-tp-${l.id}">${inner}</a>` : `<div class="card" aria-disabled="true" style="opacity:.55">${inner}</div>`;
        }).join("")}</div>
        <p class="note">Les deux TP se font dans l'ordre. L'étape TP du chapitre est validée quand les deux sont terminés.</p>`;
    }

    function vueLabo(niv, ch, lab, cle, cleL) {
      const p = profil(); p.tp2 = p.tp2 || {};
      const ck = cleL(lab), kind = lab.id;
      const rep = p.tp2[ck] = p.tp2[ck] || {};
      rep.obj = rep.obj || {}; rep.concl = rep.concl || {};
      if (!rep.tirage) { rep.tirage = tirage(kind); sauver(); }
      const T = rep.tirage, Dk = DONNEES[kind], VeVrai = Dk.Ve(T);
      const O = lab.objectifs, NC = O.length;
      O.forEach((o) => { rep.obj[o.id] = rep.obj[o.id] || { t: {}, q: [] }; });
      const objFait = (o) => o.taches.every((t) => rep.obj[o.id].t[t.id]) && o.questions.every((q, k) => rep.obj[o.id].q.indexOf(k) >= 0);
      const ongletOuvert = (i) => modeProf() || O.slice(0, i).every(objFait);
      let actif = O.findIndex((o, i) => !objFait(o) && ongletOuvert(i)); if (actif < 0) actif = NC;
      let B = null, essai = null;
      const points = () => (rep.points && rep.points.length ? rep.points : (modeProf() ? pointsIdeaux(kind, T) : []));

      view.innerHTML = `<div class="head"><span class="kicker">${esc(lab.titre)}</span><h2>${esc(lab.sousTitre)}</h2><p class="muted">${esc(lab.intro)}</p></div>
        <details class="panel tp"><summary><strong>Le TP en classe : matériel et sécurité</strong></summary>
          <div class="stack" style="margin-top:.7rem"><p>${esc(lab.enClasse.objectif)}</p><ul>${lab.enClasse.materiel.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
          <div class="safety"><strong>Sécurité</strong><ul>${lab.enClasse.securite.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div></div></details>
        <div class="otabs" id="otabs" role="tablist" style="grid-template-columns:repeat(${NC + 1},1fr)"></div>
        <div class="stack" id="tp-zone"></div>
        <a class="btn-link" href="#c-${niv}-${ch.id}-tp">Retour au choix des TP</a>`;

      function onglets() {
        $("otabs").innerHTML = O.map((o, i) => {
          const ok = objFait(o), open = ongletOuvert(i);
          return `<button class="otab${i === actif ? " cur" : ""}${ok ? " done" : ""}" role="tab" aria-selected="${i === actif}" data-i="${i}" ${open ? "" : 'aria-disabled="true"'}>
            <span class="onum">${ok ? SVG.check : open ? i + 1 : SVG.lock}</span><span class="olbl">${esc(o.onglet || o.competence)}</span></button>`;
        }).join("") + (() => {
          const open = ongletOuvert(NC), ok = !!fait(ck);
          return `<button class="otab concl${actif === NC ? " cur" : ""}${ok ? " done" : ""}" role="tab" aria-selected="${actif === NC}" data-i="${NC}" ${open ? "" : 'aria-disabled="true"'}>
            <span class="onum">${ok ? SVG.check : open ? SVG.etoile : SVG.lock}</span><span class="olbl">Conclure</span></button>`;
        })();
        $("otabs").querySelectorAll(".otab").forEach((b) => b.onclick = () => {
          const i = +b.dataset.i;
          if (!ongletOuvert(i)) { toast(i === NC ? "Réussis d'abord tous les objectifs" : "Réussis d'abord l'objectif précédent"); return; }
          actif = i; afficher(); $("otabs").scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
      function afficher() { if (B) { B.stop(); B = null; } onglets(); if (actif >= NC) afficherConclusion(); else afficherObjectif(); }

      function afficherObjectif() {
        const o = O[actif];
        $("tp-zone").innerHTML = `<div class="panel mission" id="o-carte"></div><div class="stack" id="o-docs"></div><div id="o-banc"></div><div class="stack" id="o-extra"></div><div class="stack" id="o-quest"></div><div class="stack" id="o-retenir"></div>`;
        carte();
        $("o-docs").innerHTML = (o.docs || []).map((d) => `<div class="panel c-doc"><strong>${esc(d.titre)}</strong>${d.img && ILLUS[d.img] ? `<div class="c-illus">${ILLUS[d.img]}</div>` : ""}${d.lignes.map((l) => `<p>${esc(l)}</p>`).join("")}</div>`).join("");
        if (o.banc) { essai = { points: [], eauAvant: null }; B = banc($("o-banc"), o.banc, { kind, tirage: T, evt: evenement }); }
        extra(); questions(); retenir();
      }
      function carte() {
        const o = O[actif], st = rep.obj[o.id];
        const tache = (t) => { const ok = !!st.t[t.id]; return `<li class="task${ok ? " ok" : ""}"><span class="tick">${ok ? SVG.check : ""}</span><span>${esc(t.texte)}</span></li>`; };
        $("o-carte").innerHTML = `<div class="ex-head"><span class="kicker">Objectif ${actif + 1} · ${esc(o.competence)}</span>${objFait(o) ? '<span class="badge ok">Réussi</span>' : ""}</div>
          <h3>${esc(o.titre)}</h3><p class="tag" style="align-self:flex-start">${esc(o.notion)}</p><p>${esc(o.but)}</p>
          ${o.taches.length ? `<ul class="tasks">${o.taches.map(tache).join("")}</ul>` : ""}`;
      }
      function cocher(id) {
        const o = O[actif], st = rep.obj[o.id];
        if (st.t[id] || !o.taches.some((t) => t.id === id)) return;
        st.t[id] = true; sauver(); toast("Étape réussie");
        carte();
        if (o.taches.every((t) => st.t[t.id])) questions();
        verifier();
      }
      function verifier() {
        const o = O[actif], st = rep.obj[o.id];
        if (objFait(o) && !st.fini) { st.fini = true; sauver(); enregistrer(ck + "-" + o.id, 20, false, true); onglets(); carte(); retenir(); }
      }
      function questions() {
        const o = O[actif], st = rep.obj[o.id], box = $("o-quest");
        const tachesOk = o.taches.every((t) => st.t[t.id]);
        if (!o.questions.length) { box.innerHTML = ""; return; }
        if (!tachesOk && !modeProf()) { box.innerHTML = `<div class="note">${o.banc ? "Réalise les manipulations sur la paillasse : elles sont vérifiées automatiquement." : "Fais d'abord le travail ci-dessus."} Les questions se débloquent ensuite.</div>`; return; }
        box.innerHTML = `<h3>Je vérifie que j'ai compris</h3>` + o.questions.map((q, k) => `<div class="ex${st.q.indexOf(k) >= 0 ? " reussi" : ""}" id="oq${k}"><div class="ex-head"><strong>Question ${k + 1}${q.type === "nombre" ? " · calcul" : ""}</strong><span class="badge${st.q.indexOf(k) >= 0 ? " ok" : ""}">${st.q.indexOf(k) >= 0 ? "Réussi" : "À faire"}</span></div><div class="stack" id="oqw${k}"></div></div>`).join("");
        o.questions.forEach((q, k) => {
          const ok = () => {
            if (st.q.indexOf(k) < 0) { st.q.push(k); sauver(); enregistrer(ck + "-" + o.id + "-q" + k, 5, false, true); }
            const x = $("oq" + k); if (x) { x.classList.add("reussi"); const b = x.querySelector(".badge"); b.textContent = "Réussi"; b.classList.add("ok"); }
            verifier();
          };
          if (q.type === "nombre") questionNombre($("oqw" + k), q, ok); else monterExemple($("oqw" + k), q, ok);
        });
      }
      // Question de calcul : réponse tapée, aide selon l'erreur commise
      function questionNombre(el, q, onOk) {
        el.innerHTML = `<p class="qtext">${esc(q.question)}</p><div class="calc-in"><input type="text" inputmode="decimal" autocomplete="off" aria-label="Réponse"><span class="u">${esc(q.unite)}</span></div>
          <button class="btn btn-primary btn-sm" data-v>Vérifier</button><div class="fbz"></div>`;
        el.querySelector("[data-v]").onclick = () => {
          const v = lireNombre(el.querySelector("input").value), fb = el.querySelector(".fbz");
          if (isNaN(v)) { fb.innerHTML = `<p class="error">Écris un nombre.</p>`; return; }
          if (Math.abs(v - q.reponse) <= (q.tol || 0.02) * Math.abs(q.reponse)) { el.querySelector("[data-v]").disabled = true; fb.innerHTML = `<div class="feedback ok"><strong>Bravo !</strong><span>${esc(q.explication)}</span></div>`; onOk(); }
          else { const e = (q.erreurs || []).find((x) => Math.abs(v - x.v) <= 0.02 * Math.abs(x.v)); fb.innerHTML = `<div class="feedback ko"><strong>Pas encore</strong><span>${esc(e ? e.aide : q.aide)}</span></div>`; }
        };
      }
      function retenir() {
        const o = O[actif], box = $("o-retenir");
        if (!objFait(o)) { box.innerHTML = ""; return; }
        const suiv = actif < NC - 1 ? `Objectif ${actif + 2}` : "Conclusion";
        box.innerHTML = `<div class="retenir"><strong class="lbl">Je retiens</strong><p>${esc(o.retenir)}</p></div><button class="btn btn-primary" id="btn-osuiv">Passer à : ${suiv}</button>`;
        $("btn-osuiv").onclick = () => { actif++; afficher(); $("otabs").scrollIntoView({ behavior: "smooth", block: "start" }); };
      }

      // ---------- Événements de la paillasse → étapes réussies ----------
      function evenement(type, d) {
        if (actif >= NC) return;
        const o = O[actif], S = B ? B.etat() : null;
        const map = { etal7: "etal7", etal4: "etal4", epi: "epi", eauFiole: "eau", acideFiole: "acide", jusFiole: "jus", trait: "trait", homog: "homog", burettePrete: "burette", monte: "monte", becherPrelev: "becher", ajuste: "pipette" };
        if (map[type]) cocher(map[type]);
        if (type === "rinceSonde" && rep.obj[o.id].t.etal7) cocher("rince");
        if (type === "prelever") cocher("prelever");
        if (type === "eau" && kind === "cond" && d.V >= 20 + (Dk.eauMin || 0) && essai.eauAvant == null) cocher("eau200");
        if (type === "premiereGoutte") { essai.eauAvant = d.eau; if (kind === "cond" && d.eau < Dk.eauMin) toast("Pas assez d'eau dans le bécher"); }
        if (type === "reset") { essai = { points: [], eauAvant: null }; const x = $("o-extra"); if (x) delete x.dataset.conseil; extra(); }
        if (type === "point") {
          if (!essai.points.length) rep.points = [];
          essai.points.push([d.V, d.y]);
          rep.points = essai.points.slice(); rep.eauAvant = d.eauAvant; sauver();
          if (S) { const b = S.objets.bt, a = S.objets.agi; if (b && b.barreau && a && a.on && b.sur === "agi") cocher("pret"); }
          const P = essai.points, n = P.length;
          if (n >= 2 && kind === "ph" && P[n - 1][1] - P[n - 2][1] > 1.5 && P[n - 1][0] - P[n - 2][0] >= 0.9) toast("Le pH a fait un bond : verse plus petit près de l'équivalence");
          if (kind === "cond" && d.eauAvant != null && d.eauAvant < Dk.eauMin && n === 3) toast("Sans 200 mL d'eau, les points ne seront pas alignés");
          verifierMesures(); extra();
        }
      }
      function verifierMesures() {
        const P = essai.points; if (!P.length) return;
        const Vmax = Math.max(...P.map((p) => p[0])), x = $("o-extra"), st = rep.obj[O[actif].id].t;
        if (kind === "ph") {
          const dansSaut = P.filter((p) => Math.abs(p[0] - VeVrai) <= 0.6).length;
          if (Vmax >= VeVrai + 4 && dansSaut >= 3 && P[0][0] <= 0.01) cocher("mesures");
          else if (Vmax >= VeVrai + 4 && !st.mesures && x) x.dataset.conseil = P[0][0] > 0.01 ? "zero" : "saut";
        } else {

            } });
          $("dr-g").querySelector(".c-lecture").hidden = choisir;
        }
        function ctl() {
          const st = rep.obj[O[actif].id].t, deux = st.droite1 && st.droite2;
          $("dr-ctl").innerHTML = `<div class="panel c-outil"><strong>1. Tracer les deux droites</strong>
              <p class="small">Touche les points qui forment la droite ${mode === 1 ? "<b>avant</b> l'équivalence (σ diminue)" : "<b>après</b> l'équivalence (σ augmente)"} : au moins 3 points, loin de l'équivalence. Touche un point à nouveau pour le retirer.</p>
              <div class="c-btns"><button class="btn btn-sm ${mode === 1 && choisir ? "btn-primary" : "btn-ghost"}" data-m="1">Droite 1 (${sel[1].length})</button><button class="btn btn-sm ${mode === 2 && choisir ? "btn-primary" : "btn-ghost"}" data-m="2">Droite 2 (${sel[2].length})</button><button class="btn-link" data-eff>Tout effacer</button></div>
              ${msg ? `<p class="error">${esc(msg)}</p>` : mode === 1 && sel[1].length >= 3 && sel[2].length < 3 ? `<p class="small"><b>Droite 1 tracée.</b> Ajoute d'autres points si tu veux, puis touche « Droite 2 ».</p>` : ""}</div>
            <div class="panel c-outil"><strong>2. Lire Vₑ avec le pointeur</strong>
              ${deux ? `<p class="small">Place le pointeur sur le point d'intersection des deux droites (glisse-le sur le graphique, puis règle avec les flèches) et lis son abscisse.</p>
                <button class="btn ${choisir ? "btn-primary" : "btn-ghost"} btn-sm" data-p>${choisir ? "Utiliser le pointeur" : "Revenir au choix des points"}</button>
                <div class="calc-in"><label class="small" for="ve-in">Vₑ =</label><input type="text" id="ve-in" inputmode="decimal" autocomplete="off"><span class="u">mL</span></div>
                <button class="btn btn-primary btn-sm" id="ve-ok">Vérifier</button><div class="fbz" id="ve-fb"></div>` : `<p class="small muted">Trace d'abord les deux droites.</p>`}</div>`;
          $("dr-ctl").querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { mode = +b.dataset.m; msg = ""; choisir = true; graphe(); ctl(); });
          $("dr-ctl").querySelector("[data-eff]").onclick = () => { sel[1] = []; sel[2] = []; mode = 1; msg = ""; choisir = true; graphe(); ctl(); };
          const bp = $("dr-ctl").querySelector("[data-p]"); if (bp) bp.onclick = () => { choisir = !choisir; graphe(); ctl(); };
          const ok = $("ve-ok"); if (ok) ok.onclick = () => {
            const v = lireNombre($("ve-in").value), fb = $("ve-fb");
            if (isNaN(v)) { fb.innerHTML = `<p class="error">Écris un nombre, par exemple 12,6.</p>`; return; }
            if (Math.abs(v - VeVrai) <= 0.3) { rep.ve = v; sauver(); fb.innerHTML = `<div class="feedback ok"><strong>Bravo !</strong><span>Vₑ ≈ ${fx(VeVrai, 1)} mL : c'est l'abscisse du point d'intersection des deux droites.</span></div>`; cocher("ve"); }
            else fb.innerHTML = `<div class="feedback ko"><strong>Ce n'est pas ça.</strong><span>Lis l'abscisse (sur l'axe des volumes) du point où les deux droites se coupent.</span></div>`;
          };
        }
        graphe(); ctl();
      }
      function outilPython(box) {
        const o = O[actif], st = rep.obj[o.id].t;
        box.innerHTML = `<h3>Le programme à compléter</h3><div class="ex code-trous" id="py-w"></div><div id="py-g"></div>`;
        const tracer = () => {
          const c1 = T.c / 100, V1 = 20e-3, c2 = 0.1, n0 = c1 * V1, Vs = [];
          for (let v = 0; v <= 25; v += 0.5) Vs.push(v);
          const N = { "H₃O⁺": [], "HO⁻": [], "Na⁺": [], "Cl⁻": [] };
          Vs.forEach((v) => { const nv = c2 * v * 1e-3; N["H₃O⁺"].push(nv < n0 ? n0 - nv : 0); N["HO⁻"].push(nv < n0 ? 0 : nv - n0); N["Na⁺"].push(nv); N["Cl⁻"].push(n0); });
          const g = repere(340, 220, 25, 0, 3, "V versé (mL)", "n (mmol)", 5, 0.5, 1), cls = ["s-h", "s-oh", "s-na", "s-cl"];
          $("py-g").innerHTML = `<h3>Ce que trace le programme</h3><svg class="chart c-chart" viewBox="0 0 340 220" role="img" aria-label="Quantités de matière en fonction du volume versé">${g.fond}
            ${Object.keys(N).map((k, j) => `<path d="${Vs.map((v, i) => (i ? "L" : "M") + g.X(v).toFixed(1) + " " + g.Y(N[k][i] * 1e3).toFixed(1)).join("")}" class="c-serie ${cls[j]}"/>`).join("")}</svg>
            <div class="c-legende">${Object.keys(N).map((k, j) => `<span><i class="${cls[j]}"></i>${k}</span>`).join("")}</div>
            <p class="small muted">À l'équivalence (Vₑ ≈ ${fx(VeVrai, 1)} mL), les ions H₃O⁺ sont épuisés et les ions HO⁻ commencent à s'accumuler. Les ions Na⁺ et Cl⁻ sont spectateurs.</p>`;
        };
        if (st.code) { $("py-w").innerHTML = `<pre class="c-code">${esc(o.code.replace(/\[|\]/g, ""))}</pre>`; tracer(); return; }
        widgetTrous($("py-w"), o.code, o.pieges, () => { cocher("code"); tracer(); });
      }

      // ---------- Conclusion ----------
      function resultats(Ve) {
        if (kind === "ph") { const n = 0.100 * Ve, nA = n / 3, c1 = nA / 20.0, cj = 10 * c1, Cm = cj * CITRIQUE.M; return { n, nA, c1, cj, Cm }; }
        const cS = 0.100 * Ve / 20.0, c = 100 * cS, cE = cEtiquette(), z = Math.abs(c - cE) / DONNEES.cond.u; return { cS, c, cE, z };
      }
      function afficherConclusion() {
        const C = lab.conclusion, Ve = rep.ve || VeVrai;
        $("tp-zone").innerHTML = `<div class="panel mission"><span class="kicker">Conclusion · Valider et communiquer</span><h3>${esc(C.titre)}</h3><p>${esc(C.intro)}</p>
            <div class="methode"><strong class="lbl">Le programme (terminale)</strong><ul>${C.attendus.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div></div>
          <div class="ex${rep.concl.calc ? " reussi" : ""}" id="cc-calc"><div class="ex-head"><strong>${kind === "ph" ? "Les calculs, pas à pas" : "Le calcul"}</strong><span class="badge${rep.concl.calc ? " ok" : ""}">${rep.concl.calc ? "Réussi" : "À faire"}</span></div><div class="stack" id="ccw-calc"></div></div>
          <div class="ex${rep.concl.val ? " reussi" : ""}" id="cc-val"><div class="ex-head"><strong>Je valide mon résultat</strong><span class="badge${rep.concl.val ? " ok" : ""}">${rep.concl.val ? "Réussi" : "À faire"}</span></div><div class="stack" id="ccw-val"></div></div>
          ${kind === "ph" ? `<div class="ex${rep.concl.bonus ? " reussi" : ""}" id="cc-bonus"><div class="ex-head"><strong>Pour aller plus loin</strong><span class="badge${rep.concl.bonus ? " ok" : ""}">${rep.concl.bonus ? "Réussi" : "Bonus"}</span></div><div class="stack" id="ccw-bonus"></div></div>` : ""}
          ${C.textes.map((x, k) => `<div class="ex${rep.concl[k] ? " reussi" : ""}" id="ct${k}"><div class="ex-head"><strong>${esc(x.attendu)}</strong><span class="badge${rep.concl[k] ? " ok" : ""}">${rep.concl[k] ? "Réussi" : "À faire"}</span></div><div class="stack" id="ctw${k}"></div></div>`).join("")}
          <div class="stack" id="c-fin"></div>`;
        if (kind === "ph") calculPH($("ccw-calc"), Ve); else calculCond($("ccw-calc"), Ve);
        validation($("ccw-val"), Ve);
        if (kind === "ph") bonus($("ccw-bonus"), Ve);
        C.textes.forEach((x, k) => {
          const el = $("ctw" + k);
          if (rep.concl[k]) { el.innerHTML = `<p class="trous-texte">${esc(x.texte.replace(/\[|\]/g, ""))}</p>`; return; }
          widgetTrous(el, x.texte, x.pieges, () => { rep.concl[k] = true; sauver(); enregistrer(ck + "-concl" + k, 5, false, true); marquer($("ct" + k)); fin(); });
        });
        fin();
      }
      function marquer(x) { if (!x) return; x.classList.add("reussi"); const b = x.querySelector(".badge"); b.textContent = "Réussi"; b.classList.add("ok"); }
      function calculPH(el, Ve) {
        const R = resultats(Ve), pr = (v, r) => Math.abs(v - r) <= 0.03 * Math.abs(r);
        rep.cg = rep.cg || {}; if (rep.concl.calc) rep.cg.n = 5;
        const etapes = [
          { consigne: `Quantité d'ions HO⁻ versée à l'équivalence (Vₑ = ${fx(Ve, 1)} mL ; c₂ = 0,100 mol·L⁻¹).`, formule: "n(HO⁻) = c₂ × Vₑ ; avec Vₑ en mL, le résultat est en mmol.", nom: "n(HO⁻)", unite: "mmol", val: () => R.n,
            aide: (v) => pr(v, R.n / 1000) ? "Tu as donné le résultat en mol : écris-le en mmol (multiplie par 1 000)." : pr(v, R.n * 1000) ? "Attention aux unités : 0,100 mol·L⁻¹ × V en mL donne des mmol." : "Multiplie la concentration de la soude par le volume versé à l'équivalence.", corrige: () => `n(HO⁻) = 0,100 × ${fx(Ve, 1)} ≈ ${fx(R.n, 3)} mmol` },
          { consigne: "Quantité d'acide citrique H₃A dans la prise d'essai (H₃A + 3 HO⁻ → A³⁻ + 3 H₂O).", formule: "À l'équivalence : n(H₃A) = n(HO⁻) ÷ 3.", nom: "n(H₃A)", unite: "mmol", val: () => R.nA,
            aide: (v) => pr(v, R.n * 3) ? "Tu as multiplié par 3 : une molécule de H₃A consomme 3 ions HO⁻, donc il y a 3 fois moins de H₃A que de HO⁻." : pr(v, R.n) ? "N'oublie pas le coefficient 3 de l'équation." : "Divise n(HO⁻) par 3.", corrige: () => `n(H₃A) = ${fx(R.n, 3)} ÷ 3 ≈ ${fx(R.nA, 3)} mmol` },
          { consigne: "Concentration c₁ en acide citrique du jus dilué (V₁ = 20,0 mL).", formule: "c₁ = n(H₃A) ÷ V₁ ; des mmol divisées par des mL donnent des mol·L⁻¹.", nom: "c₁", unite: "mol/L", val: () => R.c1,
            aide: (v) => pr(v, R.c1 * 1000) ? "Attention aux unités : mmol ÷ mL donne directement des mol·L⁻¹." : pr(v, 20 / R.nA) ? "Tu as inversé : c'est n ÷ V, pas V ÷ n." : "Divise n(H₃A) (en mmol) par V₁ (en mL).", corrige: () => `c₁ = ${fx(R.nA, 3)} ÷ 20,0 ≈ ${fx(R.c1, 4)} mol·L⁻¹` },
          { consigne: "Concentration c en acide citrique du jus pressé (tu l'avais dilué 10 fois).", formule: "c = F × c₁, avec F = 10.", nom: "c", unite: "mol/L", val: () => R.cj,
            aide: (v) => pr(v, R.c1 / 10) ? "Le jus pressé est PLUS concentré que le jus dilué : multiplie par 10." : "Multiplie c₁ par le facteur de dilution F = 10.", corrige: () => `c = 10 × ${fx(R.c1, 4)} ≈ ${fx(R.cj, 3)} mol·L⁻¹` },
          { consigne: "Concentration en masse Cₘ d'acide citrique dans le jus pressé (M = 192,1 g·mol⁻¹).", formule: "Cₘ = c × M.", nom: "Cₘ", unite: "g/L", val: () => R.Cm,
            aide: (v) => pr(v, R.cj / 192.1) ? "C'est une multiplication : Cₘ = c × M." : pr(v, R.c1 * 192.1) ? "Utilise c (jus pressé), pas c₁ (jus dilué)." : "Multiplie c par la masse molaire M.", corrige: () => `Cₘ = ${fx(R.cj, 3)} × 192,1 ≈ ${fx(R.Cm, 0)} g·L⁻¹` }
        ];
        calculsGuides(el, etapes, rep.cg, () => { if (!rep.concl.calc) { rep.concl.calc = true; sauver(); enregistrer(ck + "-calc", 10, false, true); marquer($("cc-calc")); } fin(); });
      }
      function bonus(el, Ve) {
        const R = resultats(Ve), m = R.Cm * 0.20;
        if (rep.concl.bonus) { el.innerHTML = `<p class="small">Dans un verre de 20 cL de jus pur : m = Cₘ × V ≈ ${fx(R.Cm, 0)} × 0,20 ≈ <b>${fx(m, 1)} g</b> d'acide citrique.</p>`; return; }
        questionNombre(el, { question: "Maïlys boit un verre de 20 cL de jus pur. Quelle masse d'acide citrique contient-il ?", unite: "g", reponse: m, tol: 0.04,
          explication: `m = Cₘ × V = ${fx(R.Cm, 0)} g·L⁻¹ × 0,20 L ≈ ${fx(m, 1)} g. (20 cL = 0,20 L.)`, aide: "Convertis 20 cL en litres (0,20 L), puis multiplie par Cₘ.",
          erreurs: [{ v: R.Cm * 20, aide: "20 cL ne font pas 20 L : convertis en litres (20 cL = 0,20 L)." }, { v: R.Cm * 2, aide: "20 cL = 0,20 L (et non 2 L)." }] }, () => { rep.concl.bonus = true; sauver(); enregistrer(ck + "-bonus", 5, false, true); marquer($("cc-bonus")); });
      }
      function champ(id, lab2, unite) { return `<div class="calc-in"><label class="small" for="${id}">${lab2}</label><input type="text" id="${id}" inputmode="decimal" autocomplete="off"><span class="u">${unite}</span></div>`; }
      function calculCond(el, Ve) {
        const R = resultats(Ve);
        el.innerHTML = `<p class="qtext">Avec ton volume à l'équivalence Vₑ = ${fx(Ve, 1)} mL, calcule (à la calculatrice) :</p>
          <ul class="small"><li>la concentration c(S) de la solution S (H₃O⁺ + HO⁻ → 2 H₂O ; V₁ = 20,0 mL ; c₂ = 0,100 mol·L⁻¹) ;</li><li>la concentration c de l'esprit de sel du flacon (S est diluée 100 fois).</li></ul>
          ${champ("cc-a", "c(S) =", "mol/L")}${champ("cc-b", "c =", "mol/L")}<button class="btn btn-primary btn-sm" data-v>Vérifier</button><div class="fbz"></div>`;
        const corr = `<div class="feedback ok"><strong>Bravo !</strong><span>c(S) = c₂ × Vₑ ÷ V₁ ≈ ${fx(R.cS, 4)} mol·L⁻¹ ; flacon : c = 100 × c(S) ≈ ${fx(R.c, 2)} mol·L⁻¹.</span></div>`;
        if (rep.concl.calc) { el.querySelector("[data-v]").remove(); el.querySelector(".fbz").innerHTML = corr; return; }
        el.querySelector("[data-v]").onclick = () => {
          const a = lireNombre($("cc-a").value), b = lireNombre($("cc-b").value), fb = el.querySelector(".fbz");
          if (isNaN(a) || isNaN(b)) { fb.innerHTML = `<p class="error">Écris un nombre dans chaque case.</p>`; return; }
          const pr = (x, ref) => Math.abs(x - ref) <= 0.03 * Math.abs(ref), okA = pr(a, R.cS), okB = pr(b, R.c);
          if (okA && okB) { rep.concl.calc = true; sauver(); enregistrer(ck + "-calc", 10, false, true); el.querySelector("[data-v]").disabled = true; fb.innerHTML = corr; marquer($("cc-calc")); fin(); }
          else fb.innerHTML = `<div class="feedback ko"><strong>${okA || okB ? "Un résultat juste sur 2" : "Pas encore"}</strong><span>${esc((okA ? "" : "c(S) = c₂ × Vₑ ÷ V₁. ") + (okB ? "" : pr(b, R.c / 100) ? "c : n'oublie pas le facteur de dilution 100." : "c = 100 × c(S)."))}</span></div>`;
        };
      }
      function validation(el, Ve) {
        const R = resultats(Ve);
        if (!rep.concl.calc && !modeProf()) { el.innerHTML = `<p class="small muted">Fais d'abord le calcul.</p>`; return; }
        let q;
        if (kind === "ph") {
          const dedans = R.Cm >= 30 && R.Cm <= 50;
          q = { question: `Tu trouves Cₘ ≈ ${fx(R.Cm, 0)} g·L⁻¹. D'après la fiche de la coopérative, un jus de maracudja mûr contient environ 30 à 50 g d'acide (exprimé en acide citrique) par litre. Que conclure ?`,
            reponses: dedans ? ["Le jus est dans la plage habituelle : le résultat est cohérent", "Le jus est beaucoup trop acide", "Le jus n'est pas acide du tout", "On ne peut rien conclure sans indicateur coloré"] : ["Le jus est en dehors de la plage habituelle : il faut vérifier le titrage", "Le jus est dans la plage habituelle", "Le jus n'est pas acide du tout", "On ne peut rien conclure sans indicateur coloré"],
            bonne: 0, explication: `${fx(R.Cm, 0)} g·L⁻¹ est ${dedans ? "compris entre 30 et 50 g·L⁻¹ : ton résultat est cohérent avec les valeurs habituelles" : "hors de la plage 30 – 50 g·L⁻¹"}. Le pH-mètre remplace l'indicateur coloré, difficile à lire dans un jus jaune.` };
        } else {
          q = { question: `Étiquette : c(étiquette) ≈ ${fx(R.cE, 1)} mol·L⁻¹. Mesure : c ≈ ${fx(R.c, 2)} mol·L⁻¹ avec u(c) = 0,15 mol·L⁻¹. Calcule |c − c(étiquette)| ÷ u(c). Que conclure ?`,
            reponses: R.z > 2 ? [`Le quotient vaut environ ${fx(R.z, 1)}, plus que 2 : le flacon ne respecte plus son étiquette`, `Le quotient vaut environ ${fx(R.z, 1)}, plus que 2 : le flacon respecte son étiquette`, `Le quotient vaut environ ${fx(R.z / 10, 2)} : le flacon respecte son étiquette`, "On ne peut pas comparer, les unités sont différentes"]
              : [`Le quotient vaut environ ${fx(R.z, 1)}, moins que 2 : le résultat est compatible avec l'étiquette`, `Le quotient vaut environ ${fx(R.z, 1)} : le flacon ne respecte pas son étiquette`, `Le quotient vaut environ ${fx(R.z * 10, 0)} : le flacon ne respecte pas son étiquette`, "On ne peut pas comparer, les unités sont différentes"],
            bonne: 0, explication: `|${fx(R.c, 2)} − ${fx(R.cE, 2)}| ÷ 0,15 ≈ ${fx(R.z, 1)}. ${R.z > 2 ? "L'écart est grand devant l'incertitude : le flacon entamé ne respecte plus son étiquette." : "L'écart est petit devant l'incertitude."}` };
        }
        const q2 = kind === "ph" ? { question: "Pourquoi a-t-on divisé par 3 dans le calcul ?", reponses: ["Une molécule d'acide citrique réagit avec trois ions HO⁻", "On a fait trois mesures", "Le jus a été dilué trois fois", "Il y a trois sauts de pH bien visibles"], bonne: 0, explication: "L'acide citrique H₃A peut céder trois ions H⁺ : H₃A + 3 HO⁻ → A³⁻ + 3 H₂O. Les trois acidités sont proches : on ne voit qu'un seul saut." }
          : { question: "Le flacon a été laissé entamé, mal fermé, dans un abri de jardin chaud. Comment expliquer que sa concentration ait baissé ?", reponses: ["Le chlorure de sodium s'est déposé au fond", "Le chlorure d'hydrogène HCl, un gaz très soluble, s'échappe peu à peu de la solution", "L'eau s'est évaporée, ce qui dilue l'acide", "La lumière a transformé l'acide en base"], bonne: 1, explication: "L'esprit de sel est une solution de chlorure d'hydrogène HCl, un gaz. Si le flacon reste ouvert ou au chaud, HCl s'échappe : la solution s'appauvrit. (Si l'eau s'évaporait, la solution serait au contraire plus concentrée.)" };
        if (rep.concl.val) { el.innerHTML = `<div class="feedback ok"><strong>Validé</strong><span>${esc(q.explication)}</span></div><div class="feedback ok"><span>${esc(q2.explication)}</span></div>`; return; }
        el.innerHTML = `<div class="stack" id="vq1"></div><div class="stack" id="vq2"></div>`;
        let ok1 = false, ok2 = false;
        const fini = () => { if (ok1 && ok2) { rep.concl.val = true; sauver(); enregistrer(ck + "-val", 10, false, true); marquer($("cc-val")); fin(); } };
        monterExemple($("vq1"), { type: "qcm", variantes: [q] }, () => { ok1 = true; fini(); });
        monterExemple($("vq2"), { type: "qcm", variantes: [q2] }, () => { ok2 = true; fini(); });
      }
      function fin() {
        const z = $("c-fin"); if (!z) return;
        const C = lab.conclusion, n = (rep.concl.calc ? 1 : 0) + (rep.concl.val ? 1 : 0) + C.textes.filter((x, k) => rep.concl[k]).length, tot = 2 + C.textes.length;
        const v = $("ccw-val"); if (v && rep.concl.calc && !rep.concl.val && v.textContent.indexOf("Fais d'abord") >= 0) validation(v, rep.ve || VeVrai);
        if (n < tot) { z.innerHTML = `<div class="level-line">Conclusion complétée <i><b style="width:${Math.round(100 * n / tot)}%"></b></i>${n}/${tot}</div>`; return; }
        const autres = ch.tp.labos.filter((l) => l.id !== lab.id);
        z.innerHTML = `<div class="retenir"><strong class="lbl">Ma fiche bilan</strong><ul>${C.textes.map((x) => `<li>${esc(x.texte.replace(/\[|\]/g, ""))}</li>`).join("")}</ul></div>
          <button class="btn btn-primary" id="btn-tp" ${fait(ck) ? "disabled" : ""}>${fait(ck) ? "TP terminé" : "J'ai terminé ce TP"}</button>`;
        $("btn-tp").onclick = () => {
          enregistrer(ck, 40, true, true);
          const tous = ch.tp.labos.every((l) => fait(cleL(l)));
          if (tous) { enregistrer(cle, 20, true, true); toast("Les deux TP sont terminés : l'entraînement est débloqué !"); }
          else toast("TP terminé : le TP suivant est débloqué");
          onglets(); fin();
          if (!tous && autres.length) z.insertAdjacentHTML("beforeend", `<a class="btn btn-ghost" href="#c-${niv}-${ch.id}-tp-${autres[0].id}">Passer au ${esc(autres[0].titre)}</a>`);
        };
      }
      afficher();
    }
    return { vueLabos, _test: { pHeq, sigma, DONNEES, tangentes, modele, pointsIdeaux, cEtiquette } };
  })();

  rendre();
})();
</script>
</body></html>
