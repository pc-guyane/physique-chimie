<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"></head><body>
<title>Appli Physique-Chimie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout : une colonne façon appli de téléphone ; barre du haut (retour + score) ; grandes cartes tactiles */
:root {
  --bg: #F2F6F4; --surface: #FFFFFF; --ink: #11302B; --muted: #55706A; --line: #D5E2DD;
  --accent: #0E7C6B; --accent-ink: #FFFFFF; --accent-soft: #DDF0EB;
  --sun-soft: #FFF1C7; --sun-ink: #6B4A00; --sun: #F2B705;
  --good: #1E7F3A; --good-soft: #DDF3E3; --bad: #B9322A; --bad-soft: #FBE1DE;
  --water: #3B8FD9; --metal: #8A9A96;
  --sea: #CDE5F2; --land: #CBE2BE; --land-out: #E3E8DF; --forest: #8DBF7A; --coast: #6E9C85;
  --bench: #DCE7E2; --bench-edge: #B9CCC4; --wire-a: #D23B30; --wire-b: #25302D; --lcd: #C9D8C2; --lcd-ink: #1D2B22;
  --f-display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-lcd: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1B19; --surface: #142725; --ink: #E3EFEB; --muted: #9DB5AE; --line: #24403B;
    --accent: #34C2AA; --accent-ink: #062420; --accent-soft: #173A35;
    --sun-soft: #3A2F0B; --sun-ink: #FFD66B; --sun: #FFD24A;
    --good: #5BD27E; --good-soft: #12321D; --bad: #FF8A7F; --bad-soft: #3A1714;
    --water: #63A9EA; --metal: #7D8F8A;
    --sea: #10283A; --land: #1C3A2A; --land-out: #18241F; --forest: #2B5A3C; --coast: #4F8A6D;
    --bench: #1A2F2B; --bench-edge: #2D4A44; --wire-a: #FF6B5E; --wire-b: #C9D6D2; --lcd: #B9CBB0; --lcd-ink: #1D2B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1B19; --surface: #142725; --ink: #E3EFEB; --muted: #9DB5AE; --line: #24403B;
  --accent: #34C2AA; --accent-ink: #062420; --accent-soft: #173A35;
  --sun-soft: #3A2F0B; --sun-ink: #FFD66B; --sun: #FFD24A;
  --good: #5BD27E; --good-soft: #12321D; --bad: #FF8A7F; --bad-soft: #3A1714;
  --water: #63A9EA; --metal: #7D8F8A;
  --sea: #10283A; --land: #1C3A2A; --land-out: #18241F; --forest: #2B5A3C; --coast: #4F8A6D;
  --bench: #1A2F2B; --bench-edge: #2D4A44; --wire-a: #FF6B5E; --wire-b: #C9D6D2; --lcd: #B9CBB0; --lcd-ink: #1D2B22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 36rem; margin: 0 auto; padding-block: .75rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }
main { display: flex; flex-direction: column; gap: 1.1rem; min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; } h2 { font-size: 1.55rem; } h3 { font-size: 1.2rem; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .9rem; }
.kicker { text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; font-weight: 700; color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.head { display: flex; flex-direction: column; gap: .35rem; }

/* Barre du haut */
.topbar { display: flex; align-items: center; gap: .6rem; min-height: 2.75rem; }
.back { display: inline-flex; align-items: center; justify-content: center; width: 2.6rem; height: 2.6rem; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.4rem; line-height: 1; cursor: pointer; flex: none; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--accent); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: flex; gap: .4rem; flex: none; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .28rem .65rem; border-radius: 999px;
  font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums; background: var(--accent-soft); color: var(--ink); }
.chip.sun { background: var(--sun-soft); color: var(--sun-ink); }
.chip svg { width: 1em; height: 1em; }

/* Boutons */
button { font: inherit; cursor: pointer; color: inherit; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: .5rem; min-height: 3rem; padding: .6rem 1.2rem;
  border-radius: var(--r); border: 2px solid transparent; font-weight: 700; font-size: 1.05rem; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-sm { min-height: 2.5rem; padding: .4rem .9rem; font-size: .95rem; }
.btn-link { background: none; border: none; color: var(--muted); text-decoration: underline; padding: .25rem 0; font-size: .9rem; align-self: flex-start; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; }
.row .btn { flex: 1 1 10rem; }

/* Cartes de navigation */
.cards { display: flex; flex-direction: column; gap: .7rem; }
.card { display: grid; grid-template-columns: 3rem 1fr auto; align-items: center; gap: .9rem; width: 100%; text-align: left;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: .85rem 1rem; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.card.off { opacity: .55; }
.card .ico { width: 3rem; height: 3rem; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; }
.card.done .ico { background: var(--good-soft); color: var(--good); }
.card .ico svg { width: 1.5rem; height: 1.5rem; }
.card .txt { min-width: 0; display: flex; flex-direction: column; gap: .1rem; }
.card .t { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.15; }
.card .s { font-size: .88rem; color: var(--muted); }
.card .go { color: var(--accent); font-family: var(--f-display); font-size: 1.6rem; line-height: 1; }
.badge { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: .18rem .5rem; border-radius: 6px; background: var(--line); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--good-soft); color: var(--good); }
.level-line { display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: var(--muted); }
.level-line i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; display: block; }
.level-line i b { display: block; height: 100%; background: var(--accent); }
.grid-niv { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .7rem; }
.niv { display: flex; flex-direction: column; gap: .35rem; align-items: flex-start; padding: 1rem; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-decoration: none; min-height: 6rem; }
.niv .n { font-family: var(--f-display); font-size: 1.6rem; line-height: 1; font-weight: 700; }
a.niv { border: 2px solid var(--accent); } a.niv .n { color: var(--accent); }
div.niv { opacity: .7; }
.group-title { font-weight: 700; color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; }
.note { background: var(--sun-soft); color: var(--sun-ink); border-radius: 12px; padding: .75rem .9rem; font-size: .95rem; }

/* Formulaires */
form.pseudo { display: flex; flex-direction: column; gap: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem; }
label { font-weight: 700; }
input[type="text"], textarea { font: inherit; font-size: 1.05rem; padding: .65rem .8rem; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
input[type="text"]:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { min-height: 5rem; resize: vertical; }
.hint { font-size: .9rem; color: var(--muted); }
.error { color: var(--bad); font-size: .9rem; font-weight: 700; }

/* QCM et retours */
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; gap: .5rem; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem; display: flex; flex-direction: column; gap: .9rem; min-width: 0; }
.tags { display: flex; gap: .4rem; flex-wrap: wrap; }
.tag { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: .15rem .55rem; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.gf { background: var(--sun-soft); color: var(--sun-ink); }
.qtext { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.options { display: flex; flex-direction: column; gap: .55rem; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: .7rem; align-items: center; text-align: left; width: 100%;
  min-height: 3.1rem; padding: .6rem .8rem; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
.opt .l { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface); border: 1px solid var(--line); }
.opt > span:last-child { min-width: 0; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--good); background: var(--good-soft); }
.opt.good .l { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .l { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.feedback { border-radius: 12px; padding: .75rem .9rem; display: flex; flex-direction: column; gap: .25rem; }
.feedback.ok { background: var(--good-soft); } .feedback.ko { background: var(--bad-soft); }
.feedback strong { font-family: var(--f-display); font-size: 1.1rem; }
.feedback.ok strong { color: var(--good); } .feedback.ko strong { color: var(--bad); }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }

/* Résultat */
.score { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; }
.score .big { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.score .big small { font-size: 1.5rem; color: var(--muted); }
.gains { display: flex; gap: .5rem; flex-wrap: wrap; }
.review-item { border-left: 4px solid var(--bad); background: var(--surface); border-radius: 0 12px 12px 0; padding: .7rem .9rem; display: flex; flex-direction: column; gap: .3rem; }
.review-item .ans { color: var(--good); font-weight: 700; }

/* Mots croisés */
.cw { display: grid; gap: 2px; width: 100%; max-width: 30rem; margin: 0 auto; }
.cw > div { aspect-ratio: 1; min-width: 0; position: relative; }
.cw .cell { background: var(--surface); border: 1px solid var(--muted); border-radius: 3px; }
.cw .cell.act { background: var(--accent-soft); }
.cw .cell.ok { background: var(--good-soft); border-color: var(--good); }
.cw .cell.ko { background: var(--bad-soft); border-color: var(--bad); }
.cw input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; padding: 0; color: var(--ink);
  font-family: var(--f-body); font-weight: 700; font-size: clamp(.8rem, 3.6vw, 1.1rem); text-transform: uppercase; caret-color: var(--accent); }
.cw input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.cw .num { position: absolute; top: 0; left: 2px; font-size: .55rem; font-weight: 700; color: var(--muted); line-height: 1; pointer-events: none; }
.clues { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.clues ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
.clue { text-align: left; background: none; border: none; padding: .3rem .4rem; border-radius: 8px; width: 100%; }
.clue.act { background: var(--accent-soft); }
.clue b { color: var(--accent); margin-right: .3rem; }

/* Relier par des traits */
.rel { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 2.4rem; align-items: stretch; }
.rel-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
.rel-col { display: flex; flex-direction: column; gap: .55rem; justify-content: space-around; min-width: 0; }
.rel-item { display: flex; align-items: center; gap: .45rem; background: var(--surface); border: 2px solid var(--line); border-radius: 10px;
  padding: .5rem .55rem; font-size: .9rem; line-height: 1.3; min-height: 3rem; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.rel-item .rel-txt { flex: 1; min-width: 0; }
.rel-item .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); flex: none; }
.rel-item.sel { border-color: var(--accent); background: var(--accent-soft); }
.rel-item.sel .dot, .rel-item.match .dot { background: var(--accent); }
.rel-item.match { border-color: var(--good); }
.rel-item.ko { border-color: var(--bad); background: var(--bad-soft); }
@media (max-width: 24rem) { .rel { column-gap: 1.8rem; } .rel-item { font-size: .84rem; padding: .45rem; } }

/* Chaîne énergétique horizontale : source encadrée, convertisseur entouré, énergie sur la flèche */
.chain-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: .2rem; }
.chain-h { display: flex; align-items: center; width: max-content; min-width: 100%; padding: .6rem .3rem 2rem; }
.ce { font-size: .88rem; line-height: 1.25; text-align: center; color: var(--ink); }
.ce.src { border: 2px solid var(--ink); border-radius: 2px; padding: .55rem .7rem; font-weight: 700; background: var(--surface); max-width: 8rem; }
.conv-wrap { position: relative; }
.ce.conv { border: 2px solid var(--accent); border-radius: 50%; padding: 1rem .9rem; font-weight: 700; background: var(--surface); max-width: 9rem; min-width: 5.5rem; }
.perte { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: .74rem; color: var(--bad); white-space: nowrap; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.ce.arr { display: flex; flex-direction: column; align-items: stretch; min-width: 6.6rem; padding: 0 .15rem; }
.arr .lab { font-size: .8rem; min-height: 1.3em; padding: .1rem .25rem; border-radius: 6px; }
.arr .line { display: block; height: 2px; background: var(--ink); position: relative; margin: .2rem 6px 0 0; }
.arr .line::after { content: ""; position: absolute; right: -8px; top: -5px; border-left: 9px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.slot { cursor: pointer; font: inherit; }
.ce.slot.src, .ce.slot.conv { border-style: dashed; color: var(--muted); }
.ce.slot.filled { border-style: solid; color: var(--ink); }
.arr.slot { background: none; border: none; }
/* Forme d'énergie sur la flèche : jamais encadrée. Case vide = « ? » souligné ; remplie = texte simple ; corrigée = texte vert ou rouge. */
.ce.arr.slot, .ce.arr.slot.filled, .ce.arr.slot.ok, .ce.arr.slot.ko, .ce.arr.slot.cur { border: none; background: none; box-shadow: none; border-radius: 0; }
.arr.slot .lab { border: none; border-bottom: 2px dashed var(--muted); border-radius: 0; background: none; color: var(--muted); min-height: 2rem; display: flex; align-items: center; justify-content: center; }
.arr.slot.filled .lab { border-bottom-color: transparent; color: var(--ink); }
.arr.slot.cur .lab { border-bottom-color: var(--accent); color: var(--accent); font-weight: 700; }
.arr.slot.ok .lab { border-bottom-color: transparent; color: var(--good); font-weight: 700; }
.arr.slot.ko .lab { border-bottom-color: transparent; color: var(--bad); text-decoration: line-through; }
.slot.cur.src, .slot.cur.conv { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.slot.ok.src, .slot.ok.conv { border-color: var(--good); background: var(--good-soft); color: var(--ink); }
.slot.ko.src, .slot.ko.conv { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); }
.fix { display: block; font-size: .72rem; color: var(--good); font-weight: 700; margin-top: .15rem; }
.scroll-hint { font-size: .8rem; color: var(--accent); text-align: right; margin-top: -.4rem; }
.pool { display: flex; flex-wrap: wrap; gap: .45rem; }
.piece { text-align: center; padding: .5rem .75rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: .92rem; }
.piece.obj { border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: .8rem; font-size: .8rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend .ls { width: 1.1rem; height: .8rem; border: 2px solid var(--ink); }
.legend .lc { width: 1.2rem; height: .85rem; border: 2px solid var(--accent); border-radius: 50%; }
.legend .la { width: 1.3rem; height: 2px; background: var(--ink); position: relative; }

/* Tri */
.sort-card { text-align: center; padding: 1.6rem 1rem; }
.sort-card .src { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.2; }
.tri-row { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--line); }
.tri-row:last-child { border-bottom: none; }
.tri-row .bts { display: flex; gap: .35rem; }
.tri-row .bts button { padding: .35rem .6rem; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); font-size: .85rem; font-weight: 700; }
.tri-row .bts button.ok { border-color: var(--good); background: var(--good-soft); }
.tri-row .bts button.ko { border-color: var(--bad); background: var(--bad-soft); }

/* Calcul */
.calc-in { display: flex; gap: .5rem; align-items: center; }
.calc-in input { max-width: 9rem; font-variant-numeric: tabular-nums; }
.calc-in .u { font-weight: 700; }

/* Cours */
.cours { display: flex; flex-direction: column; gap: .85rem; }
.cours h3 { color: var(--accent); margin-top: .6rem; }
.cours ul, .cours ol { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: .35rem; }
.skills { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .4rem; }
.skills li { list-style: none; display: flex; gap: .5rem; align-items: flex-start; }
.skills ul { padding: 0; }
.skills .ck { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: .15rem; display: flex; align-items: center; justify-content: center; color: #fff; transition: background .3s, border-color .3s; }
.skills .ck svg { width: .8rem; height: .8rem; }
.skills li.fait .ck { background: var(--good); border-color: var(--good); }
.skills li.fait .ct { color: var(--good); font-weight: 700; }
.skills li.nouveau { animation: comp-gagne 1.2s ease-out; border-radius: 8px; }
@keyframes comp-gagne { 0% { background: var(--good-soft); transform: scale(1); } 25% { transform: scale(1.04); } 100% { background: transparent; transform: scale(1); } }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .92rem; background: var(--surface); }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--accent-soft); font-weight: 700; }
tr:last-child td { border-bottom: none; }
.methode { border: 2px solid var(--accent); border-radius: 12px; padding: .8rem 1rem; display: flex; flex-direction: column; gap: .4rem; }
.methode strong.lbl { font-family: var(--f-display); color: var(--accent); font-size: 1.05rem; }
.retenir { background: var(--accent-soft); border-radius: 12px; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .4rem; }
.retenir strong.lbl { font-family: var(--f-display); font-size: 1.15rem; color: var(--accent); }

            { t: "p", texte: "Une multiprise supporte une intensité maximale, souvent <strong>16 A</strong>. Au-delà, son fil <strong>chauffe</strong> : il y a un risque d'incendie. Il faut alors répartir les appareils sur plusieurs prises murales." },

              "Intensité : I = P ÷ U = 4 000 ÷ 230 ≈ 17,4 A.",
              "17,4 A est plus grand que 16 A : la multiprise est <strong>surchargée</strong>, c'est dangereux."

            { t: "h", texte: "4. L'énergie électrique : E = P × t" },

            { t: "p", texte: "Avec P en <strong>watts (W)</strong> et t en <strong>secondes (s)</strong>, on obtient E en <strong>joules (J)</strong>. Rappel : 1 min = 60 s ; 1 h = 3 600 s." },
            { t: "methode", titre: "Exemple résolu", items: [
              "Un ventilateur de 50 W fonctionne pendant 2 h.",
              "Je convertis la durée : t = 2 h = 2 × 3 600 s = 7 200 s.",

            ] },
            { t: "exemple", type: "qcm", competence: 3, variantes: [

              { question: "Une lampe de 1,8 W reste allumée 10 s. Quelle énergie consomme-t-elle ?", reponses: ["0,18 J", "18 J", "11,8 J", "5,6 J"], bonne: 1,
                explication: "E = P × t = 1,8 × 10 = 18 J." },
              { question: "Un chargeur de 10 W fonctionne pendant 1 h. Quelle énergie consomme-t-il, en joules ?", reponses: ["10 J", "600 J", "36 000 J", "3 600 J"], bonne: 2,
                explication: "t = 1 h = 3 600 s. E = 10 × 3 600 = 36 000 J. (600 J : on a compté 60 s au lieu de 3 600 s.)" }
            ] },

            { t: "h", texte: "5. Le kilowattheure (kWh)" },
            { t: "p", texte: "Le joule est une toute petite unité. À la maison, on utilise le <strong>kilowattheure (kWh)</strong> : avec P en <strong>kilowatts (kW)</strong> et t en <strong>heures (h)</strong>, on obtient E en <strong>kWh</strong>." },
            { t: "p", texte: "1 kWh est l'énergie consommée par un appareil de 1 kW pendant 1 h : <strong>1 kWh = 1 000 W × 3 600 s = 3 600 000 J</strong>." },

<script>
(function () {
  "use strict";

  const RUBRIQUES = [

    { id: "cours", nom: "Cours", desc: "Les notions, avec des exemples à faire" },

  const SVG = {

    chimie: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 007-7c0-4-3-6.5-4-10-1.5 2-2 3.5-2 5-1.5-1-2.5-2.5-2.5-4C7 8 5 11 5 15a7 7 0 007 7z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
    etoile: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'
  };

  // ======================= Outils =======================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const melanger = (t) => { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; };
  const tirer = (t, n) => melanger(t).slice(0, n);
  const hasard = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const sansAccent = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const nombre = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const view = $("view");
  const h = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; };

  // ======================= Stockage local =======================
  function charger() { try { const d = JSON.parse(localStorage.getItem(CLE)); if (d && d.profils) return d; } catch (e) {} return { pseudo: null, profils: {} }; }
  const etat = charger();
  delete etat.apercuProf; // ancienne coche « Aperçu prof » : elle n'a plus d'effet
  // En mode prof, rien n'est enregistré : la progression des élèves reste intacte.
  function sauver() { if (modeProf()) return; try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }
  function profil() {
    let p = etat.profils[etat.pseudo];
    if (!p) p = etat.profils[etat.pseudo] = {};
    p.points = p.points || 0; p.serie = p.serie || 0; p.faits = p.faits || {}; p.records = p.records || {}; p.tp = p.tp || {}; p.cours = p.cours || {};
    return p;
  }
  function jour(dec) { const d = new Date(); d.setDate(d.getDate() + (dec || 0)); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const serieAffichee = (p) => (p.dernierJour === jour(0) || p.dernierJour === jour(-1)) ? p.serie : 0;
  // ======================= Mode prof (lien secret, valable pour cette visite seulement) =======================
  const CLE_PROF = "pc-guyane-prof";
  let profActif = false;
  try { profActif = sessionStorage.getItem(CLE_PROF) === "1"; } catch (e) {}
  const modeProf = () => !!(REGLAGES.modeProf || profActif);
  async function activerProf(code) {
    // on efface tout de suite le code de la barre d'adresse
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    let ok = false;
    try {
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(code));
      const hex = Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
      ok = !!REGLAGES.empreinteProf && hex === String(REGLAGES.empreinteProf).toLowerCase();
    } catch (e) {}
    if (ok) { profActif = true; try { sessionStorage.setItem(CLE_PROF, "1"); } catch (e) {} toast("Mode prof activé"); }
    else toast("Lien non reconnu");
    if (location.hash) location.hash = ""; else rendre();
  }
  function quitterProf() {
    profActif = false;
    try { sessionStorage.removeItem(CLE_PROF); } catch (e) {}
    // on recharge la progression enregistrée : ce qui a été fait en mode prof disparaît
    const neuf = charger(); Object.keys(etat).forEach((k) => { delete etat[k]; }); Object.assign(etat, neuf); delete etat.apercuProf;
    toast(REGLAGES.modeProf ? "modeProf est à true dans REGLAGES : remets-le à false" : "Mode prof désactivé");
    rendre();
  }
  function majProf() { $("bandeau-prof").hidden = !modeProf(); }
  $("btn-quitter-prof").addEventListener("click", quitterProf);
  const seuil = () => (REGLAGES.seuilReussite == null ? 50 : REGLAGES.seuilReussite);

  // Enregistre une activité : points gagnés et, si réussie, l'étape suivante se débloque.
  // Règle « meilleure tentative » : on ne gagne des points que si l'on fait mieux qu'avant,
  // et une validation obtenue n'est jamais retirée.
  function enregistrer(cle, points, reussi, uneFois) {
    const p = profil();
    p.meilleurs = p.meilleurs || {};
    let avant = p.meilleurs[cle];
    if (avant == null && p.faits[cle]) avant = points; // activité validée avant cette version : points déjà gagnés
    avant = avant || 0;
    const gain = Math.max(0, points - avant);
    p.meilleurs[cle] = Math.max(avant, points);
    p.points += gain;
    if (reussi) p.faits[cle] = true;
    if (p.dernierJour !== jour(0)) { p.serie = (p.dernierJour === jour(-1)) ? p.serie + 1 : 1; p.dernierJour = jour(0); }
    sauver(); majStats();
    if (gain > 0) toast("+" + gain + " points");
    return gain;
  }
  function majStats() {
    $("stats").hidden = !etat.pseudo;
    if (etat.pseudo) { const p = profil(); $("stat-points").textContent = p.points; $("stat-serie").textContent = serieAffichee(p); }
  }
  let toastTimer = null;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800); }

  // ======================= Données et progression =======================
  const niveau = (id) => CONTENU.niveaux.find((n) => n.id === id);
  const chapitres = (niv) => CONTENU.chapitres[niv] || [];
  const chapitre = (niv, id) => chapitres(niv).find((c) => c.id === id);
  const ouvert = (niv, id) => modeProf() || !!(REGLAGES.chapitresOuverts || {})[niv + "-" + id];
  const qcmDu = (ch) => (typeof QUESTIONS !== "undefined" ? QUESTIONS.filter((q) => q.chapitre === ch.qcm) : []);
  const fait = (cle) => !!profil().faits[cle];
  function activites(ch, rub) {
    if (rub === "rappel") return (ch.rappel && ch.rappel.activites) || [];
    if (rub === "entrainement") return (ch.entrainement || []).filter((a) => a.type !== "qcm-tableur" || qcmDu(ch).length);
    return [];
  }
  function rubriqueDispo(ch, rub) { return (rub === "rappel" || rub === "entrainement") ? activites(ch, rub).length > 0 : !!ch[rub]; }
  // Règle de déblocage : une activité ne compte que si toutes celles d'avant sont validées.
  // (Une activité validée « dans le désordre », par exemple avec l'ancien aperçu prof, ne compte pas.)
  function nbValidees(niv, ch, rub) {
    const acts = activites(ch, rub); let n = 0;
    while (n < acts.length && fait(`${niv}-${ch.id}-${rub}-${acts[n].id}`)) n++;
    return n;
  }
  function rubriqueComplete(niv, ch, rub) {
    if (!rubriqueDispo(ch, rub)) return true;
    if (rub === "rappel" || rub === "entrainement") return nbValidees(niv, ch, rub) === activites(ch, rub).length;
    return fait(niv + "-" + ch.id + "-" + rub);
  }
  // Nombre d'étapes du chapitre terminées dans l'ordre (Rappel, Cours, TP, Entraînement)
  function nbEtapesFaites(niv, ch) {
    let n = 0;
    while (n < RUBRIQUES.length && rubriqueComplete(niv, ch, RUBRIQUES[n].id)) n++;
    return n;
  }
  function rubriqueOuverte(niv, ch, idx) { return modeProf() || idx <= nbEtapesFaites(niv, ch); }
  function rubriqueValidee(niv, ch, idx) { return idx < nbEtapesFaites(niv, ch); }
  function activiteOuverte(niv, ch, rub, i) { return modeProf() || i <= nbValidees(niv, ch, rub); }
  function activiteValidee(niv, ch, rub, i) { return i < nbValidees(niv, ch, rub); }

  // ======================= Navigation =======================
  let routeActuelle = [];
  function aller(hh) { if (location.hash.slice(1) === hh) rendre(); else location.hash = hh; }
  function parent(parts) {
    if (parts.length <= 1) return "";
    if (parts[0] === "c" && parts.length === 3) return "n-" + parts[1];
    return parts.slice(0, -1).join("-");
  }
  $("btn-back").addEventListener("click", () => aller(parent(routeActuelle)));
  window.addEventListener("hashchange", rendre);

  function rendre() {
    const hh = location.hash.slice(1);
    const parts = hh ? hh.split("-") : [];
    routeActuelle = parts;

  // ======================= Lancement d'une activité =======================
  function lancer(act, ctx) {
    const page = (kicker, titre, sous) => `<div class="head"><span class="kicker">${esc(kicker)}</span><h2>${esc(titre)}</h2>${sous ? `<p class="muted">${esc(sous)}</p>` : ""}</div>`;

  // Barème et meilleure note de l'exercice type brevet
  const bareme = (act) => (act.questions || []).reduce((s, q) => s + (q.points || 0), 0);
  function meilleureNote(cle, act) {
    const p = profil();
    if (p.notes && p.notes[cle] != null) return p.notes[cle];
    // progression enregistrée avant cette version : on retrouve la note à partir du pourcentage
    return p.records[cle] != null ? Math.round(p.records[cle] * bareme(act) / 100) : null;
  }
  // Écran de résultat commun : enregistre la meilleure tentative, débloque, propose la suite
  function resultat(o) {
    const pct = o.total ? Math.round(100 * o.score / o.total) : 0;
    const reussi = pct >= seuil();
    const p = profil(), cle = o.ctx.cle, ancien = p.records[cle];
    const dejaFait = fait(cle), valide = reussi || dejaFait;
    p.records[cle] = Math.max(ancien || 0, pct);
    let meilleurTxt = ancien != null && ancien > pct ? ancien + " %" : "";
    if (o.note) {
      p.notes = p.notes || {};
      const avant = meilleureNote(cle, { questions: [{ points: o.total }] });
      p.notes[cle] = Math.max(avant == null ? 0 : avant, o.score);
      meilleurTxt = avant != null && avant > o.score ? avant + "/" + o.total : "";
    }
    sauver();
    const gain = enregistrer(cle, o.points != null ? o.points : o.score * 10, reussi, false);
    const msg = pct === 100 ? "Sans faute, bravo !" : pct >= 75 ? "Très bien joué !" : reussi ? "Réussi, continue !"
      : dejaFait ? "Moins bien que ta meilleure tentative, mais ta validation est conservée." : "Pas encore : rejoue pour débloquer la suite.";
    const gains = gain > 0 ? ["+" + gain + " points"] : [];
    if (ancien != null && pct > ancien) gains.push("Nouveau record");
    if (reussi && !dejaFait) gains.push(o.ctx.dernier ? "Étape terminée" : "Jeu suivant débloqué");
    view.innerHTML = `<div class="score"><span class="muted small">${esc(o.titre)}</span><div class="big">${o.score}<small> / ${o.total}</small></div>
      <h2>${msg}</h2>${gains.length ? `<div class="gains">${gains.map((g) => `<span class="chip sun">${esc(g)}</span>`).join("")}</div>` : ""}
      ${meilleurTxt ? `<p class="small muted">Ta meilleure tentative reste enregistrée : ${esc(meilleurTxt)}.</p>` : ""}
      ${!valide ? `<p class="small muted">Il faut au moins ${seuil()} % pour débloquer la suite.</p>` : ""}</div>
      ${o.revoir && o.revoir.length ? `<h3>À revoir</h3><div class="stack">${o.revoir.map((r) => `<div class="review-item"><span>${esc(r.q)}</span><span class="ans">${esc(r.a)}</span>${r.e ? `<span class="muted small">${esc(r.e)}</span>` : ""}</div>`).join("")}</div>` : ""}
      <div class="row"><button class="btn btn-ghost" id="btn-rejouer">Rejouer (nouvelle version)</button>${valide ? `<a class="btn btn-primary" href="#${o.ctx.suivant}">${o.ctx.dernier ? "Retour au chapitre" : "Jeu suivant"}</a>` : ""}</div>`;
    $("btn-rejouer").onclick = () => rendre();

  // ======================= Widgets réutilisables =======================

  // --- Relier par des traits ---
  function widgetRelier(el, paires, onFin) {
    const n = paires.length, gauche = melanger(paires.map((p, i) => i)), droite = melanger(paires.map((p, i) => i));
    const erreurs = paires.map(() => 0), relie = new Set();
    el.innerHTML = `<div class="rel"><svg class="rel-svg" aria-hidden="true"></svg>
      <div class="rel-col">${gauche.map((i) => `<div class="rel-item" data-side="L" data-i="${i}" role="button" tabindex="0"><span class="rel-txt">${esc(paires[i][0])}</span><span class="dot"></span></div>`).join("")}</div>
      <div class="rel-col">${droite.map((i) => `<div class="rel-item" data-side="R" data-i="${i}" role="button" tabindex="0"><span class="dot"></span><span class="rel-txt">${esc(paires[i][1])}</span></div>`).join("")}</div></div><div class="fbz"></div>`;
    const rel = el.querySelector(".rel"), svg = el.querySelector(".rel-svg");
    const item = (side, i) => rel.querySelector(`.rel-item[data-side="${side}"][data-i="${i}"]`);
    function centre(it) { const d = it.querySelector(".dot").getBoundingClientRect(), r = rel.getBoundingClientRect(); return [d.left + d.width / 2 - r.left, d.top + d.height / 2 - r.top]; }
    function ligne(a, b, couleur, id) { return `<line ${id ? `id="${id}"` : ""} x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${couleur}" stroke-width="3" stroke-linecap="round"/>`; }
    function dessiner(extra) {
      let s = "";
      relie.forEach((i) => { s += ligne(centre(item("L", i)), centre(item("R", i)), "var(--accent)"); });
      svg.innerHTML = s + (extra || "");
    }
    let sel = null, drag = null;
    function essayer(a, b) {
      const L = a.dataset.side === "L" ? a : b, R = a.dataset.side === "L" ? b : a;
      const iL = +L.dataset.i, iR = +R.dataset.i;
      sel = null; rel.querySelectorAll(".sel").forEach((x) => x.classList.remove("sel"));
      if (iL === iR) {
        relie.add(iL); L.classList.add("match"); R.classList.add("match"); dessiner();
        if (relie.size === n) { el.querySelector(".fbz").innerHTML = `<div class="feedback ok"><strong>Tout est relié !</strong></div>`; setTimeout(() => onFin(erreurs), 700); }
      } else {
        erreurs[iL]++;
        L.classList.add("ko"); R.classList.add("ko");
        dessiner(ligne(centre(L), centre(R), "var(--bad)"));
        setTimeout(() => { L.classList.remove("ko"); R.classList.remove("ko"); dessiner(); }, 650);
      }
    }
    rel.querySelectorAll(".rel-item").forEach((it) => {
      it.addEventListener("pointerdown", (e) => {
        if (it.classList.contains("match")) return;
        e.preventDefault();
        drag = { it, x: e.clientX, y: e.clientY, bouge: false };
        const depart = centre(it), r = rel.getBoundingClientRect();
        const move = (ev) => {
          if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 8) drag.bouge = true;
          if (drag.bouge) dessiner(ligne(depart, [ev.clientX - r.left, ev.clientY - r.top], "var(--muted)"));
        };
        const up = (ev) => {
          window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
          const d = drag; drag = null;
          if (!d) return;
          if (d.bouge) {
            dessiner();
            const cible = document.elementFromPoint(ev.clientX, ev.clientY);
            const t = cible && cible.closest(".rel-item");
            if (t && rel.contains(t) && t.dataset.side !== it.dataset.side && !t.classList.contains("match")) essayer(it, t);
          } else clic(it);

        window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);

      if (it.classList.contains("match")) return;

  }
  // --- Chaîne énergétique horizontale ---
  const parseEl = (s) => { const k = s.indexOf(":"); return { t: s.slice(0, k), x: s.slice(k + 1) }; };
  function chaineHTML(elements, o) {
    o = o || {};
    const els = elements.map(parseEl);
    const lastConv = els.map((e) => e.t).lastIndexOf("C");
    const inner = els.map((e, k) => {
      const trou = o.trous && o.trous.indexOf(k) >= 0;
      const cls = e.t === "S" ? "src" : e.t === "C" ? "conv" : "arr";
      const perte = (o.perte && k === lastConv) ? `<span class="perte"><span>↓</span>${esc(o.perte)}</span>` : "";
      if (!trou) {
        if (cls === "arr") return `<div class="ce arr"><span class="lab">${esc(e.x)}</span><span class="line"></span></div>`;
        const box = `<div class="ce ${cls}">${esc(e.x)}</div>`;
        return cls === "conv" ? `<div class="conv-wrap">${box}${perte}</div>` : box;
      }
      const val = o.rempli && o.rempli[k];
      const st = (o.etat && o.etat[k]) || "";
      const fix = (st === "ko" && o.correction) ? `<span class="fix">→ ${esc(e.x)}</span>` : "";
      const classes = `ce ${cls} slot${val ? " filled" : ""}${o.cur === k ? " cur" : ""}${st ? " " + st : ""}`;
      const aria = `aria-label="Case ${cls === "arr" ? "forme d'énergie" : cls === "src" ? "source" : "convertisseur"}"`;
      if (cls === "arr") return `<button class="${classes}" data-k="${k}" ${aria}><span class="lab">${val ? esc(val) : "?"}</span><span class="line"></span>${fix}</button>`;
      const b = `<button class="${classes}" data-k="${k}" ${aria}>${val ? esc(val) : "?"}${fix}</button>`;
      return cls === "conv" ? `<div class="conv-wrap">${b}${perte}</div>` : b;
    }).join("");
    return `<div class="chain-scroll"><div class="chain-h">${inner}</div></div>`;
  }
  // Indique qu'une chaîne trop large se fait glisser (sur téléphone)
  function marquerDefilement(root) {

      corr: `Énergie dissipée = énergie reçue − énergie utile = ${f(recue)} − ${f(utile)} = ${f(dissipee)} ${u}.` };
    if (mode === "utile") return { texte: `${O} reçoit ${f(recue)} ${u} ${c.entree}. ${f(dissipee)} ${u} sont dissipés sous forme de chaleur. Calcule l'énergie électrique fournie.`, rep: utile, u,
      corr: `Énergie utile = énergie reçue − énergie dissipée = ${f(recue)} − ${f(dissipee)} = ${f(utile)} ${u}.` };
    return { texte: `${O} fournit ${f(utile)} ${u} d'énergie électrique et dissipe ${f(dissipee)} ${u} sous forme de chaleur. Calcule l'énergie reçue.`, rep: recue, u,

  // --- Mots croisés générés au hasard ---
  function genererGrille(pool, n, maxC, maxL) {
    let best = null;
    for (let essai = 0; essai < 160; essai++) {
      const mots = melanger(pool);
      const g = new Map(), places = [];
      const key = (r, c) => r + "," + c;
      const peut = (w, r, c, s) => {
        const dr = s === "V" ? 1 : 0, dc = s === "H" ? 1 : 0; let inter = 0;
        if (g.has(key(r - dr, c - dc)) || g.has(key(r + dr * w.length, c + dc * w.length))) return -1;

        }

      const bornes = (extra) => { let a = Infinity, b = -Infinity, cmin = Infinity, cmax = -Infinity; const tout = [...g.keys()].map((k) => k.split(",").map(Number)).concat(extra || []); tout.forEach(([r, c]) => { a = Math.min(a, r); b = Math.max(b, r); cmin = Math.min(cmin, c); cmax = Math.max(cmax, c); }); return { r0: a, c0: cmin, L: b - a + 1, C: cmax - cmin + 1 }; };

  // ======================= Cours interactif =======================
  function vueCours(niv, ch) {
    const cle = `${niv}-${ch.id}-cours`, p = profil();
    const reussis = new Set(p.cours[cle] || []);
    const exemples = ch.cours.blocs.map((b, k) => b.t === "exemple" ? k : -1).filter((k) => k >= 0);
    // Compétence n° i (0, 1, 2…) : validée quand tous les exemples qui déclarent « competence: i+1 » sont réussis.
    // Calculée à partir des exemples réussis déjà enregistrés : rien de nouveau n'est stocké.
    const exComp = (i) => exemples.filter((k) => ch.cours.blocs[k].competence === i + 1);
    const compFaite = (i) => exComp(i).length > 0 && exComp(i).every((k) => reussis.has(k));
    const html = ch.cours.blocs.map((b, k) => {
      if (b.t === "h") return `<h3>${esc(b.texte)}</h3>`;
      if (b.t === "p") return `<p>${b.texte}</p>`;
      if (b.t === "liste") return `<ul>${b.items.map((i) => `<li>${i}</li>`).join("")}</ul>`;
      if (b.t === "tableau") return `<div class="table-wrap"><table><thead><tr>${b.entetes.map((e) => `<th>${esc(e)}</th>`).join("")}</tr></thead><tbody>${b.lignes.map((l) => `<tr>${l.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (b.t === "methode") return `<div class="methode"><strong class="lbl">${esc(b.titre || "Méthode")}</strong><ul>${b.items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`;
      if (b.t === "chaine") return `<div class="stack">${b.legende ? `<p class="small muted">${esc(b.legende)}</p>` : ""}${legendeChaine}${chaineHTML(b.elements, { perte: b.perte })}</div>`;
      if (b.t === "retenir") return `<div class="retenir"><strong class="lbl">À retenir</strong><ul>${b.items.map((i) => `<li>${i}</li>`).join("")}</ul></div>`;
      if (b.t === "exemple") return `<div class="ex${reussis.has(k) ? " reussi" : ""}" id="ex${k}"><div class="ex-head"><strong>À toi !</strong><span class="badge${reussis.has(k) ? " ok" : ""}">${reussis.has(k) ? "Réussi" : "Exemple " + (exemples.indexOf(k) + 1) + "/" + exemples.length}</span></div><div class="stack" id="exw${k}"></div></div>`;

      <div class="level-line" id="cours-prog"></div>
      <article class="cours">${html}</article>
      <button class="btn btn-primary" id="btn-fin-cours"></button>`;
    const maj = () => {
      const n = exemples.filter((k) => reussis.has(k)).length;
      $("cours-prog").innerHTML = `Exemples réussis <i><b style="width:${Math.round(100 * n / exemples.length)}%"></b></i>${n}/${exemples.length}`;

    };
    const reussir = (k) => {
      if (!reussis.has(k)) {
        const avant = ch.cours.competences.map((c, i) => compFaite(i));
        reussis.add(k); profil().cours[cle] = [...reussis]; sauver(); enregistrer(cle + "-ex" + k, 5, false, true);
        ch.cours.competences.forEach((c, i) => {

    const fin = (ok) => { if (ok) onOk(); else encore(); };
    el.innerHTML = "";

    else if (b.type === "tri") widgetTriListe(w, tirer(b.items, b.n || 4), (j, t) => fin(j === t));

      <details class="panel tp"><summary><strong>Le TP en classe : matériel et sécurité</strong></summary>
        <div class="stack" style="margin-top:.7rem"><p>${esc(tp.enClasse.objectif)}</p><ul>${tp.enClasse.materiel.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>
        <div class="safety"><strong>Sécurité</strong><ul>${tp.enClasse.securite.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div></div></details>
      <div class="otabs" id="otabs" role="tablist"></div>
      <div class="stack" id="tp-zone"></div>`;

    function onglets() {
      $("otabs").innerHTML = O.map((o, i) => {
        const ok = objFait(o), open = ongletOuvert(i);
        return `<button class="otab${i === actif ? " cur" : ""}${ok ? " done" : ""}" role="tab" aria-selected="${i === actif}" data-i="${i}" ${open ? "" : 'aria-disabled="true"'}>
          <span class="onum">${ok ? SVG.check : open ? i + 1 : SVG.lock}</span><span class="olbl">${esc(o.competence)}</span></button>`;
      }).join("") + (() => {
        const open = ongletOuvert(NC), ok = !!fait(cle);
        return `<button class="otab concl${actif === NC ? " cur" : ""}${ok ? " done" : ""}" role="tab" aria-selected="${actif === NC}" data-i="${NC}" ${open ? "" : 'aria-disabled="true"'}>
          <span class="onum">${ok ? SVG.check : open ? SVG.etoile : SVG.lock}</span><span class="olbl">Conclure</span></button>`;
      })();
      $("otabs").querySelectorAll(".otab").forEach((b) => b.onclick = () => {
        const i = +b.dataset.i;
        if (!ongletOuvert(i)) { toast(i === NC ? "Réussis les 4 objectifs pour conclure" : "Réussis d'abord l'objectif précédent"); return; }
        actif = i; afficher(); $("otabs").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    // ---------- Un objectif ----------
    function afficherObjectif() {
      const o = O[actif], st = rep.obj[o.id];
      temps = {}; vus = {};
      $("tp-zone").innerHTML = `<div class="panel mission" id="o-carte"></div><div id="o-banc"></div><div class="stack" id="o-extra"></div><div class="stack" id="o-quest"></div><div class="stack" id="o-retenir"></div>`;
      carteObjectif();
      L = paillasse($("o-banc"), evenement);
      L.charger(MONTAGES[o.id]);
      extra(); questions(); retenir();
    }
    function carteObjectif() {
      const o = O[actif], st = rep.obj[o.id];
      const tache = (t) => { const ok = !!st.t[t.id]; return `<li class="task${ok ? " ok" : ""}"><span class="tick">${ok ? SVG.check : ""}</span><span>${esc(t.texte)}</span></li>`; };
      $("o-carte").innerHTML = `<div class="ex-head"><span class="kicker">Objectif ${actif + 1} · ${esc(o.competence)}</span>${objFait(o) ? '<span class="badge ok">Réussi</span>' : ""}</div>
        <h3>${esc(o.titre)}</h3><p class="tag" style="align-self:flex-start">${esc(o.notion)}</p><p>${esc(o.but)}</p>
        <ul class="tasks">${o.taches.map(tache).join("")}</ul>`;
    }
    function extra() {
      const o = O[actif], box = $("o-extra");
      if (o.id[0] === "w") return extraW(box, o);
      if (o.id !== "o2") { box.innerHTML = ""; return; }
      const m = rep.mesures;
      if (!m.length) { box.innerHTML = `<h3>Mes mesures</h3><p class="small muted">Aucune mesure pour l'instant. Quand l'écran affiche une tension stable, touche NOTER sur le multimètre.</p>`; return; }
      const W = 300, H = 170, x0 = 44, y0 = 136, xs = (d) => x0 + d * 78, ys = (u) => y0 - u * 18;
      const pts = m.map((x) => `<circle cx="${xs(x.debit)}" cy="${ys(x.u).toFixed(1)}" r="5" fill="var(--accent)"/>`).join("");
      box.innerHTML = `<h3>Mes mesures</h3><div class="mesures">
        <div class="table-wrap"><table class="mes-table"><thead><tr><th>Débit d'eau</th><th>Tension (V)</th></tr></thead><tbody>
          ${m.map((x) => `<tr><td>${x.debit} (${DEBIT(x.debit)})</td><td>${x.u.toFixed(2).replace(".", ",")}</td></tr>`).join("")}</tbody></table></div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tension produite en fonction du débit d'eau">
          ${[0, 2, 4, 6].map((u) => `<line x1="${x0}" x2="${xs(3) + 10}" y1="${ys(u)}" y2="${ys(u)}" stroke="var(--line)"/><text x="${x0 - 8}" y="${ys(u) + 4}" text-anchor="end">${u}</text>`).join("")}
          ${[0, 1, 2, 3].map((d) => `<text x="${xs(d)}" y="${y0 + 16}" text-anchor="middle">${d}</text>`).join("")}
          <line x1="${x0}" y1="${y0}" x2="${xs(3) + 10}" y2="${y0}" stroke="var(--muted)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${ys(6.6)}" stroke="var(--muted)"/>
          <text x="${xs(1.5)}" y="${H - 2}" text-anchor="middle">Débit d'eau</text><text x="${x0 - 30}" y="${ys(6.6) - 6}">U (V)</text>${pts}</svg></div>
        <button class="btn-link" id="btn-eff">Effacer mes mesures</button>`;
      $("btn-eff").onclick = () => { rep.mesures = []; sauver(); extra(); };
    }
    function questions() {
      const o = O[actif], st = rep.obj[o.id], box = $("o-quest");
      const tachesOk = o.taches.every((t) => st.t[t.id]);
      if (!tachesOk && !modeProf()) { box.innerHTML = `<div class="note">Réalise les manipulations sur la paillasse : elles sont vérifiées automatiquement. Les questions se débloquent ensuite.</div>`; return; }
      box.innerHTML = `<h3>Je vérifie que j'ai compris</h3>` + o.questions.map((q, k) => `<div class="ex${st.q.indexOf(k) >= 0 ? " reussi" : ""}" id="oq${k}"><div class="ex-head"><strong>Question ${k + 1}</strong><span class="badge${st.q.indexOf(k) >= 0 ? " ok" : ""}">${st.q.indexOf(k) >= 0 ? "Réussi" : "À faire"}</span></div><div class="stack" id="oqw${k}"></div></div>`).join("");
      o.questions.forEach((q, k) => {
        const ok = () => {
          if (st.q.indexOf(k) < 0) { st.q.push(k); sauver(); enregistrer(cle + "-" + o.id + "-q" + k, 5, false, true); }
          const x = $("oq" + k); if (x) { x.classList.add("reussi"); const b = x.querySelector(".badge"); b.textContent = "Réussi"; b.classList.add("ok"); }
          verifierObjectif();
        };
        if (q.type === "releve") questionReleve($("oqw" + k), ok); else if (q.type === "produit") questionProduit($("oqw" + k), ok); else monterExemple($("oqw" + k), q, ok);
      });
    }
    function questionReleve(el, onOk) {
      el.innerHTML = `<p class="qtext">Relève les compteurs, puis calcule l'énergie dissipée.</p>
        <p class="small muted">Le compteur de la turbine indique l'énergie reçue ; le joulemètre indique l'énergie électrique reçue par la lampe (énergie utile).</p>
        <button class="btn btn-primary btn-sm" data-r>Relever les compteurs</button><div class="zr stack"></div>`;
      el.querySelector("[data-r]").onclick = () => {
        const c = L.compteurs(), zr = el.querySelector(".zr");
        if (c.Ein < 50 || c.Ej < 5) { zr.innerHTML = `<p class="error">Les compteurs sont trop petits : laisse la lampe allumée à travers le joulemètre un peu plus longtemps.</p>`; return; }
        const ein = Math.round(c.Ein), eu = Math.round(c.Ej), ed = ein - eu;
        zr.innerHTML = `<div class="methode"><span>Énergie reçue par la turbine : <strong>${nombre(ein)} J</strong></span><span>Énergie électrique reçue par la lampe : <strong>${nombre(eu)} J</strong></span></div>
          <label class="small" for="rel-in">Énergie dissipée</label><div class="calc-in"><input type="text" id="rel-in" inputmode="decimal" autocomplete="off"><span class="u">J</span></div>
          <button class="btn btn-primary btn-sm" data-v>Vérifier</button><div class="fbz"></div>`;
        zr.querySelector("[data-v]").onclick = (e) => {
          const v = parseFloat(zr.querySelector("input").value.replace(/\s| /g, "").replace(",", "."));
          if (isNaN(v)) { zr.querySelector(".fbz").innerHTML = `<p class="error">Écris un nombre, par exemple 65.</p>`; return; }
          const ok = Math.abs(v - ed) <= 1;
          e.target.disabled = true;
          zr.querySelector(".fbz").innerHTML = `<div class="feedback ${ok ? "ok" : "ko"}"><strong>${ok ? "Bravo !" : "Ce n'est pas ça."}</strong><span>Énergie dissipée = énergie reçue − énergie utile = ${nombre(ein)} − ${nombre(eu)} = ${nombre(ed)} J.</span></div>`;
          if (ok) onOk(); else zr.insertAdjacentHTML("beforeend", `<p class="small muted">Fais un nouveau relevé et recommence.</p>`);
        };
      };
    }
    function retenir() {
      const o = O[actif], box = $("o-retenir");
      if (!objFait(o)) { box.innerHTML = ""; return; }
      const suiv = actif < NC - 1 ? `Objectif ${actif + 2}` : "Conclusion";
      box.innerHTML = `<div class="retenir"><strong class="lbl">Je retiens</strong><p>${esc(o.retenir)}</p></div>
        <button class="btn btn-primary" id="btn-osuiv">Passer à : ${suiv}</button>`;
      $("btn-osuiv").onclick = () => { actif++; afficher(); $("otabs").scrollIntoView({ behavior: "smooth", block: "start" }); };
    }
    function cocher(id) {
      const o = O[actif], st = rep.obj[o.id];
      if (st.t[id] || !o.taches.some((t) => t.id === id)) return;
      st.t[id] = true; sauver(); toast("Manipulation réussie");
      carteObjectif();
      if (o.taches.every((t) => st.t[t.id])) questions();
      verifierObjectif();
    }
    function verifierObjectif() {
      const o = O[actif], st = rep.obj[o.id];
      if (objFait(o) && !st.fini) { st.fini = true; sauver(); enregistrer(cle + "-" + o.id, 20, false, true); onglets(); carteObjectif(); retenir(); }
    }
    // Vérification automatique des manipulations, à partir de l'état de la paillasse
    function evenement(type, d) {
      if (actif >= NC) return;
      const id = O[actif].id, st = rep.obj[id];
      const duree = (k, cond) => { temps[k] = cond ? (temps[k] || 0) + (d.dt || 0) : 0; return temps[k]; };
      if (id[0] === "w") return evenementW(type, d, id, st, duree);
      if (type === "mesure" && id === "o2") {
        if (d.gen !== "alternateur" || d.mode !== "AC") return;
        rep.mesures.push({ debit: d.debit, u: d.u }); sauver(); extra();
        if (new Set(rep.mesures.map((m) => m.debit)).size >= 3) cocher("mesures");
        return;
      }
      if (type !== "etat") return;
      const lampeAlt = d.lampeU > 1.2 && d.lampeVia === "alternateur";
      if (id === "o1") {
        if (d.moteurs.eau && d.omega > 0.3) cocher("tourne");
        if (d.couple) cocher("couple");
        if (lampeAlt && duree("allume", true) >= 0.5) cocher("allume");
        if (st.t.allume && d.debit === 0 && d.lampeU < 0.4) cocher("ferme");
      }
      if (id === "o2" && d.mm) {
        if (d.mm.branche && d.mm.gen === "alternateur") cocher("branche");
        if (d.mm.mode === "AC" && d.mm.gen === "alternateur" && Math.abs(d.mm.u) > 0.5 && duree("reglage", true) >= 0.75) cocher("reglage");
      }
      if (id === "o3") {
        if (duree("vent", lampeAlt && d.moteurs.vent && !d.moteurs.vapeur) >= 1) cocher("vent");
        if (duree("vapeur", lampeAlt && d.moteurs.vapeur) >= 1) cocher("vapeur");
        if (duree("soleil", d.lampeU > 1.2 && d.lampeVia === "panneau") >= 1) cocher("soleil");
      }
      if (id === "o4") {
        if (d.lampeViaJ && d.lampeU > 1.2 && duree("jm", true) >= 0.5) cocher("joulemetre");
        if (d.Ein >= 100 && d.Ej > 10) cocher("cent");
        d.vise.forEach((v) => { if (v.type === "alternateur" && v.T > 30) vus.alt = true; if (v.type === "lampe" && v.T > 33) vus.lampe = true; });
        if (vus.alt && vus.lampe) cocher("chaleur");
      }
    }


    // ---------- Chapitre 2 : mesures, vérifications et calcul de U × I ----------
    const LAMPES = { L1: 0.6, L2: 1.8 };
    const fU = (v) => v == null ? "…" : virg(v.toFixed(2));
    const fI = (m) => m && m.I != null ? virg(m.cal === "mA" ? m.I.toFixed(4).replace(/0+$/, "") : m.I.toFixed(2)) : "…";
    function evenementW(type, d, id, st, duree) {
      if (type === "plaque") { if (id === "w1" && d.lampe === "L1") cocher("plaque"); if (id === "w3" && d.lampe === "L2") { cocher("plaque2"); extra(); } return; }
      if (type === "mesure2") {
        if (id !== "w2") return;
        rep.mesW = rep.mesW || {};
        const m = rep.mesW[d.lampe] = rep.mesW[d.lampe] || {};
        m[d.g] = d.v; if (d.g === "I") m.cal = d.cal;
        sauver(); extra();
        const M = rep.mesW;
        if (M.L1 && M.L1.U != null) cocher("u1");
        if (M.L1 && M.L1.I != null) cocher("i1");
        if (M.L2 && M.L2.U != null && M.L2.I != null) cocher("l2");
        return;
      }
      if (type === "joule20") {
        if (id !== "w4") return;
        rep.joule = rep.joule || {}; rep.joule[d.lampe] = d.E; sauver(); extra();
        if (rep.joule.L2 != null) cocher("jl2");
        if (rep.joule.L1 != null) cocher("jl1");
        return;
      }
      if (type !== "etat" || !d.elec) return;
      const seule = (n) => d.allumees.length === 1 && d.allumees[0] === n;
      if (id === "w1") {
        if (d.ouvert && d.siFerme.indexOf("L1") >= 0 && !d.allumees.length) cocher("monte");
        if (duree("allume", st.t.monte && seule("L1") && d.commande) >= 0.5) cocher("allume");
      }
      if (id === "w3") {
        if (duree("a1", seule("L1")) >= 1) cocher("eclatL1");
        if (duree("a2", seule("L2")) >= 1) cocher("eclatL2");
      }
    }
    function extraW(box, o) {
      const M = rep.mesW || {}, J = rep.joule || {};
      if (o.id === "w2") {
        box.innerHTML = `<h3>Mes mesures</h3><div class="table-wrap"><table class="mes-table"><thead><tr><th>Lampe</th><th>U (V)</th><th>I (A)</th></tr></thead><tbody>
          ${["L1", "L2"].map((n) => `<tr><td>${n}</td><td>${fU(M[n] && M[n].U)}</td><td>${fI(M[n])}</td></tr>`).join("")}</tbody></table></div>
          <p class="small muted">Touche NOTER sur le multimètre quand la lampe est allumée. Une nouvelle mesure remplace l'ancienne.</p>`;
      } else if (o.id === "w3") {
        const st = rep.obj.w3;
        box.innerHTML = `<h3>Mes mesures et les plaques</h3><div class="table-wrap"><table class="mes-table"><thead><tr><th>Lampe</th><th>U (V)</th><th>I (A)</th><th>Puissance indiquée</th></tr></thead><tbody>
          ${["L1", "L2"].map((n) => `<tr><td>${n}</td><td>${fU(M[n] && M[n].U)}</td><td>${fI(M[n])}</td><td>${n === "L1" || (st && st.t.plaque2) ? virg(LAMPES[n]) + " W" : "?"}</td></tr>`).join("")}</tbody></table></div>`;
      } else if (o.id === "w4") {
        box.innerHTML = `<h3>Mes relevés au joulemètre</h3><div class="table-wrap"><table class="mes-table"><thead><tr><th>Lampe</th><th>Durée</th><th>Énergie (J)</th></tr></thead><tbody>
          ${["L2", "L1"].map((n) => `<tr><td>${n} (${virg(LAMPES[n])} W)</td><td>20 s</td><td>${J[n] != null ? J[n] : "…"}</td></tr>`).join("")}</tbody></table></div>
          <p class="small muted">Le relevé se fait tout seul quand le chrono du joulemètre atteint 20 s.</p>`;
      } else box.innerHTML = "";
    }
    // Question « produit » : l'élève calcule U × I avec SES mesures et compare à la plaque
    function questionProduit(el, onOk) {
      const M = rep.mesW || {}, complet = ["L1", "L2"].every((n) => M[n] && M[n].U != null && M[n].I != null);
      if (!complet && !modeProf()) { el.innerHTML = `<p class="error">Il manque des mesures : retourne à l'objectif 2 pour noter U et I des deux lampes.</p>`; return; }
      const val = (n) => complet ? M[n] : { U: 6, I: LAMPES[n] / 6, cal: "A" };
      el.innerHTML = `<p class="qtext">Avec tes mesures, calcule U × I pour chaque lampe (à la calculatrice). Compare avec la puissance indiquée sur sa plaque.</p>
        ${complet ? "" : `<p class="small muted">Mode prof : valeurs types (6 V ; 0,1 A et 0,3 A), car les mesures de l'objectif 2 manquent.</p>`}
        ${["L1", "L2"].map((n) => `<div class="stack"><span class="small"><strong>${n}</strong> : U = ${fU(val(n).U)} V ; I = ${fI(val(n))} A ; plaque : ${virg(LAMPES[n])} W</span>
          <div class="calc-in"><label class="small" for="pr-${n}">U × I =</label><input type="text" id="pr-${n}" inputmode="decimal" autocomplete="off"><span class="u">W</span></div></div>`).join("")}
        <button class="btn btn-primary btn-sm" data-v>Vérifier</button><div class="fbz"></div>`;
      el.querySelector("[data-v]").onclick = () => {
        const lu = (n) => parseFloat(el.querySelector("#pr-" + n).value.replace(/\s| /g, "").replace(",", "."));
        const bon = (n) => { const p = val(n).U * val(n).I, v = lu(n); return !isNaN(v) && Math.abs(v - p) <= Math.max(0.02, 0.03 * p); };
        const fb = el.querySelector(".fbz");
        if (["L1", "L2"].some((n) => isNaN(lu(n)))) { fb.innerHTML = `<p class="error">Écris un nombre dans chaque case, par exemple 0,6.</p>`; return; }
        if (["L1", "L2"].every(bon)) {
          el.querySelector("[data-v]").disabled = true;
          fb.innerHTML = `<div class="feedback ok"><strong>Bravo !</strong><span>${["L1", "L2"].map((n) => `${n} : U × I = ${fU(val(n).U)} × ${fI(val(n))} ≈ ${virg((val(n).U * val(n).I).toFixed(2))} W, presque la puissance indiquée (${virg(LAMPES[n])} W).`).join(" ")} U × I donne la puissance de la lampe.</span></div>`;
          onOk();
        } else fb.innerHTML = `<div class="feedback ko"><strong>${["L1", "L2"].filter(bon).length} résultat juste sur 2</strong><span>Multiplie la tension (en V) par l'intensité (en A) : U × I. Vérifie la virgule.</span></div>`;
      };
    }

    // ---------- Conclusion (onglet ultime) ----------
    function afficherConclusion() {
      L = null;
      const C = tp.conclusion;
      $("tp-zone").innerHTML = `<div class="panel mission"><span class="kicker">Conclusion</span><h3>Ce que j'ai compris dans le laboratoire</h3>
          <p>Complète la conclusion avec les mots de la banque. Chaque paragraphe reprend un objectif ; l'ensemble correspond à ce que dit le programme.</p>
          <div class="methode"><strong class="lbl">Le programme (cycle 4)</strong><ul>${C.attendus.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div></div>
        ${C.textes.map((x, k) => `<div class="ex${rep.concl[k] ? " reussi" : ""}" id="ct${k}"><div class="ex-head"><strong>${esc(x.attendu)}</strong><span class="badge${rep.concl[k] ? " ok" : ""}">${rep.concl[k] ? "Réussi" : "Objectif " + (O.findIndex((o) => o.id === x.obj) + 1)}</span></div><div class="stack" id="ctw${k}"></div></div>`).join("")}
        <div class="ex${rep.concl.chaine ? " reussi" : ""}" id="ct-ch"><div class="ex-head"><strong>Chaîne énergétique</strong><span class="badge${rep.concl.chaine ? " ok" : ""}">${rep.concl.chaine ? "Réussi" : "À faire"}</span></div><div class="stack" id="ctw-ch"></div></div>
        <div class="stack" id="c-fin"></div>`;
      C.textes.forEach((x, k) => {
        const el = $("ctw" + k);
        if (rep.concl[k]) { el.innerHTML = `<p class="trous-texte">${esc(x.texte.replace(/\[|\]/g, ""))}</p>`; return; }
        widgetTrous(el, x.texte, x.pieges, () => { rep.concl[k] = true; sauver(); enregistrer(cle + "-concl" + k, 5, false, true); marquer($("ct" + k)); fin(); });
      });
      const elc = $("ctw-ch"), chn = C.chaine;
      if (rep.concl.chaine) { elc.innerHTML = `<p class="qtext">${esc(chn.nom)}</p>${legendeChaine}${chaineHTML(chn.elements, { perte: chn.perte })}`; marquerDefilement(elc); }
      else widgetChaine(elc, chn, { mode: "essais", trous: chn.trous, distracteurs: chn.distracteurs, nbDistracteurs: 3, perte: chn.perte }, () => { rep.concl.chaine = true; sauver(); enregistrer(cle + "-concl-chaine", 10, false, true); marquer($("ct-ch")); fin(); });
      fin();
    }
    function marquer(x) { if (!x) return; x.classList.add("reussi"); const b = x.querySelector(".badge"); b.textContent = "Réussi"; b.classList.add("ok"); }
    function fin() {
      const z = $("c-fin"); if (!z) return;
      if (!conclFaite()) { const n = tp.conclusion.textes.filter((x, k) => rep.concl[k]).length + (rep.concl.chaine ? 1 : 0); z.innerHTML = `<div class="level-line">Conclusion complétée <i><b style="width:${Math.round(100 * n / (NC + 1))}%"></b></i>${n}/${NC + 1}</div>`; return; }
      z.innerHTML = `<div class="retenir"><strong class="lbl">Ma fiche bilan</strong><ul>${tp.conclusion.textes.map((x) => `<li>${esc(x.texte.replace(/\[|\]/g, ""))}</li>`).join("")}</ul></div>
        <button class="btn btn-primary" id="btn-tp" ${fait(cle) ? "disabled" : ""}>${fait(cle) ? "TP terminé" : "J'ai terminé le TP"}</button>`;
      $("btn-tp").onclick = () => { enregistrer(cle, 40, true, true); onglets(); fin(); toast("TP terminé : direction Cayenne pour l'entraînement !"); };
    }

    function afficher() { onglets(); if (actif >= NC) afficherConclusion(); else afficherObjectif(); }
    afficher();
  }
